<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bubble Day</title>
<meta name="theme-color" content="#03070d">
<meta name="description" content="A neon arcade to-do list: blast your tasks off the grid.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bubble Day">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cy:#6ff6ff;--cy2:#00d8ff;--or:#ffa424;--ink:#d8fbff;--panel:rgba(2,14,22,.78);--edge:rgba(111,246,255,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;font-family:"Rajdhani",system-ui,sans-serif;color:var(--ink);background:#010306}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
/* CRT scanlines + vignette over everything */
.crt{position:fixed;inset:0;z-index:80;pointer-events:none;
  background:repeating-linear-gradient(rgba(0,0,0,0) 0 2px,rgba(0,0,0,.16) 2px 3px),radial-gradient(ellipse 120% 100% at 50% 50%,transparent 60%,rgba(0,0,0,.55) 100%)}
.glass{background:var(--panel);border:1px solid var(--edge);box-shadow:0 0 18px rgba(0,216,255,.25),inset 0 0 14px rgba(0,216,255,.12);
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}

/* top bar */
.top{position:fixed;top:0;left:0;right:0;height:calc(64px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:center;z-index:30;padding-top:env(safe-area-inset-top)}
.tabs{display:flex;gap:4px;padding:5px}
.tabs button{padding:7px 16px;font-family:"Orbitron",sans-serif;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.65;transition:.2s}
.tabs button.on{opacity:1;color:#011;background:var(--cy);box-shadow:0 0 16px var(--cy2)}
.tabs .n{display:inline-block;min-width:20px;margin-left:8px;padding:0 6px;font-size:10px;border:1px solid currentColor}
#hud{position:fixed;left:16px;top:calc(14px + env(safe-area-inset-top));z-index:31;font-family:"Orbitron",sans-serif;line-height:1.15;pointer-events:none}
#hud .k{font-size:9px;letter-spacing:.3em;color:var(--or);text-shadow:0 0 8px rgba(255,164,36,.8)}
#hud .v{font-size:20px;font-weight:900;letter-spacing:.12em;color:#fff;text-shadow:0 0 6px var(--cy),0 0 16px var(--cy2)}

/* tools */
.tools{position:fixed;left:14px;top:50%;transform:translateY(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;padding:8px}
.tools button{width:48px;height:48px;display:grid;place-items:center;opacity:.7;position:relative;transition:.2s;color:var(--cy)}
.tools button svg{width:26px;height:26px;filter:drop-shadow(0 0 4px var(--cy2))}
.tools button:hover{opacity:1}
.tools button[aria-pressed=true]{opacity:1;color:#011;background:var(--cy);box-shadow:0 0 18px var(--cy2)}
.tools button[aria-pressed=true] svg{filter:none}
.tools button[data-tool=pin][aria-pressed=true]{background:var(--or);box-shadow:0 0 18px var(--or)}
.tools .sep{height:1px;background:var(--edge);margin:2px 8px}
.tools button .tip{position:absolute;left:60px;white-space:nowrap;background:var(--panel);border:1px solid var(--edge);color:var(--cy);padding:4px 10px;font:700 10px "Orbitron",sans-serif;letter-spacing:.12em;text-transform:uppercase;opacity:0;pointer-events:none;transition:.15s}
.tools button:hover .tip{opacity:1}

/* stage */
#stage{position:fixed;top:calc(64px + env(safe-area-inset-top));left:0;right:0;bottom:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;z-index:2}
#foam{position:absolute;inset:0;width:100%;height:100%}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;pointer-events:none}
.lab{will-change:transform;position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none;transition:opacity .3s}
.lab .t{line-height:1.08;outline:none;overflow-wrap:normal;hyphens:manual;max-width:none;min-width:1ch;color:#fff;caret-color:#fff;
  text-shadow:0 0 4px var(--c,var(--cy)),0 0 12px var(--c,var(--cy)),0 1px 2px #000}
.lab.group .t{font-family:"Orbitron",sans-serif;font-weight:900;font-size:15px;letter-spacing:.1em;text-transform:uppercase}
.lab.task .t{font-weight:700;font-size:18px;letter-spacing:.02em}
.lab .t:empty::before{content:attr(data-ph);opacity:.55}
.lab.editing{pointer-events:auto}
.lab.editing .t{cursor:text}
.age{font:700 9px "Orbitron",sans-serif;letter-spacing:.12em;padding:1px 6px;margin-bottom:3px;white-space:nowrap;color:#011;background:var(--or);box-shadow:0 0 8px var(--or)}
.age[hidden]{display:none}
.c-wrap{display:flex;flex-direction:column;align-items:center;line-height:1;font-family:"Orbitron",sans-serif;color:#fff;text-shadow:0 0 6px var(--cy),0 0 18px var(--cy2)}
.c-wk{font-size:12px;font-weight:700;letter-spacing:.42em;margin-left:.42em;color:var(--cy);text-transform:uppercase}
.c-day{font-size:66px;font-weight:900;margin:6px 0 4px}
.c-mo{font-size:12px;font-weight:700;letter-spacing:.28em;margin-left:.28em;text-transform:uppercase}
.c-stat{font:700 13px "Rajdhani",sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--or);text-shadow:0 0 8px rgba(255,164,36,.9);margin-top:10px}
.hint{position:absolute;width:320px;margin-left:-160px;text-align:center;font:700 12px "Orbitron",sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--cy);text-shadow:0 0 8px var(--cy2);pointer-events:none;transition:opacity .4s;animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.popc{position:absolute;left:0;top:0;pointer-events:none}
.score-pop{position:absolute;left:0;top:0;font:900 22px "Orbitron",sans-serif;color:#fff;text-shadow:0 0 8px var(--or),0 0 18px var(--or);pointer-events:none;white-space:nowrap}
#beam{position:fixed;inset:0;z-index:35;pointer-events:none}

#help{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));text-align:center;font:700 10px "Orbitron",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--cy);text-shadow:0 0 6px var(--cy2);opacity:.75;pointer-events:none;z-index:5;padding:0 80px}

/* targeting reticle (laser mode cursor) */
#pin{position:fixed;left:0;top:0;width:48px;height:48px;z-index:40;pointer-events:none;display:none;will-change:transform}
body.pin.hasmouse #pin{display:block}
#pin svg{width:48px;height:48px;transition:transform .08s;filter:drop-shadow(0 0 4px var(--or))}
#pin.stab svg{transform:scale(.75) rotate(45deg)}

/* typing bar (phones) */
#editBar{position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));z-index:70;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px}
#editBar[hidden]{display:none}
#editBar .k{font:700 9px "Orbitron",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--or);white-space:nowrap}
#editBar textarea{flex:1;min-width:0;resize:none;overflow:hidden;height:36px;line-height:34px;white-space:nowrap;font:700 20px "Rajdhani",system-ui,sans-serif;color:#fff;background:transparent;border:0;border-bottom:1px solid var(--edge);outline:none;padding:0 2px;caret-color:var(--cy)}
#editBar .btn{padding:7px 14px}
#editBar .cx{font-size:24px;opacity:.6;padding:0 4px;color:var(--cy)}
#zoomHint{position:fixed;right:12px;top:calc(74px + env(safe-area-inset-top));z-index:20;font:700 10px "Orbitron",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--cy);padding:7px 12px;opacity:0;pointer-events:none;transition:opacity .3s}
#zoomHint.on{opacity:1;pointer-events:auto}

/* backup sheet */
.veil{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px}
.veil[hidden]{display:none}
.sheet{width:min(440px,100%);padding:22px 22px 18px;max-height:90vh;overflow:auto}
.sheet h2{margin:0 0 6px;font:900 16px "Orbitron",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 0 10px var(--cy2)}
.sheet p{margin:4px 0 12px;font-size:16px;opacity:.8;line-height:1.3}
.sheet h3{margin:14px 0 6px;font:700 11px "Orbitron",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--or)}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:700 11px "Orbitron",sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:10px 16px;color:var(--cy);border:1px solid var(--cy);background:rgba(0,216,255,.08);box-shadow:inset 0 0 10px rgba(0,216,255,.15)}
.btn:hover,.btn:focus-visible{background:rgba(0,216,255,.2);box-shadow:0 0 14px var(--cy2)}
.btn.primary{color:#011;background:var(--cy);box-shadow:0 0 14px var(--cy2)}
.sheet textarea{width:100%;height:86px;margin-top:8px;font:12px/1.3 ui-monospace,Menlo,monospace;color:var(--cy);background:rgba(0,0,0,.5);border:1px solid var(--edge);padding:8px;resize:vertical}
.sheet .x{position:absolute;right:16px;top:12px;font-size:24px;color:var(--cy);opacity:.7}
.sheet .msg{min-height:22px;margin-top:8px;font-size:16px;font-weight:700;color:var(--or)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:50;padding:10px 18px;font-size:16px;font-weight:700;display:flex;gap:14px;align-items:center;transition:.3s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{font:700 11px "Orbitron",sans-serif;letter-spacing:.12em;color:var(--or);text-transform:uppercase}

/* completed view */
#doneView{position:fixed;top:calc(64px + env(safe-area-inset-top));left:0;right:0;bottom:0;overflow:auto;z-index:10;padding:14px 16px 60px}
#doneView[hidden]{display:none}
.dwrap{max-width:720px;margin:0 auto;padding:18px 20px 26px;background:var(--panel);border:1px solid var(--edge);box-shadow:0 0 22px rgba(0,216,255,.2),inset 0 0 22px rgba(0,216,255,.08);
  clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{padding:12px 8px;text-align:center;border:1px solid var(--edge);background:rgba(0,216,255,.05)}
.stat b{display:block;font:900 26px "Orbitron",sans-serif;color:#fff;text-shadow:0 0 10px var(--cy2)}
.stat span{font:700 9px "Orbitron",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--cy);opacity:.85}
.week{display:flex;gap:10px;align-items:flex-end;height:96px;padding:10px 12px 6px;margin-bottom:18px;border-bottom:1px solid var(--edge)}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;font:700 10px "Orbitron",sans-serif;color:var(--cy)}
.week i{display:block;width:62%;max-width:24px;min-height:3px;background:var(--cy);box-shadow:0 0 10px var(--cy2)}
.week div.t i{background:var(--or);box-shadow:0 0 10px var(--or)}
.week div.t{color:var(--or)}
.day{margin-bottom:18px}
.day h3{margin:0 0 8px;font:900 13px "Orbitron",sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#fff;text-shadow:0 0 8px var(--cy2);display:flex;justify-content:space-between;align-items:baseline}
.day h3 span{font:700 13px "Rajdhani",sans-serif;letter-spacing:.1em;color:var(--or);text-shadow:none}
.item{display:flex;align-items:center;gap:12px;padding:8px 10px;margin-bottom:6px;border-left:2px solid hsl(var(--h),100%,60%);background:linear-gradient(90deg,hsla(var(--h),100%,60%,.12),transparent 70%);animation:fadein .4s both}
@keyframes fadein{from{opacity:0;transform:translateX(-10px)}}
.tick{flex:none;width:26px;height:26px;display:grid;place-items:center;font:900 12px "Orbitron",sans-serif;color:hsl(var(--h),100%,70%);border:1px solid hsl(var(--h),100%,60%);box-shadow:0 0 8px hsla(var(--h),100%,60%,.7),inset 0 0 6px hsla(var(--h),100%,60%,.5)}
.item .tx{flex:1;min-width:0;overflow-wrap:anywhere;font-size:18px;font-weight:700;color:#fff;line-height:1.15}
.chip{font:700 9px "Orbitron",sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;margin-left:8px;display:inline-block;color:hsl(var(--h),100%,72%);border:1px solid hsla(var(--h),100%,60%,.7);vertical-align:2px}
.when{font:700 10px "Orbitron",sans-serif;letter-spacing:.1em;color:var(--cy);opacity:.7;white-space:nowrap}
.item .undo{opacity:.55;padding:2px 8px;font-size:18px;color:var(--cy)}
.item .undo:hover{opacity:1}
.empty{text-align:center;padding:40px 10px;font:700 12px/1.8 "Orbitron",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--cy);white-space:pre-line}

@media (max-width:640px){
  .tools{left:50%;top:auto;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);flex-direction:row}
  .tools .sep{width:1px;height:auto;margin:8px 2px}
  .tools button .tip{display:none}
  #help{bottom:calc(86px + env(safe-area-inset-bottom));padding:0 20px;font-size:9px}
  #toast{bottom:calc(120px + env(safe-area-inset-bottom))}
  .dwrap{padding:14px 12px 22px}
  #hud{top:calc(70px + env(safe-area-inset-top));left:12px}
  #hud .v{font-size:15px}
}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="hud"><div class="k">SCORE</div><div class="v" id="score">000000</div></div>
<canvas id="beam" aria-hidden="true"></canvas>
<header class="top">
  <nav class="tabs glass">
    <button data-tab="bubbles" class="on">Bubbles</button>
    <button data-tab="done">Completed<span class="n" id="doneCount">0</span></button>
  </nav>
</header>

<aside class="tools glass" id="tools">
  <button data-tool="cursor" aria-pressed="true" aria-label="Cursor">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 7-6 2-2 6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span class="tip">Cursor · V</span></button>
  <button data-tool="pin" aria-pressed="false" aria-label="Laser: destroy tasks">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h12l2 2h4v2h-4l-2 1H9l-1.5 5h-3L6 14H3z"/><path d="M15 9V7h-4v2M9 12h4"/></svg><span class="tip">Laser · P</span></button>
  <button data-tool="erase" aria-pressed="false" aria-label="Delete">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg><span class="tip">Delete bubble · X</span></button>
  <div class="sep"></div>
  <button id="soundBtn" aria-pressed="true" aria-label="Sound">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="wave" d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></svg><span class="tip">Pop sound</span></button>
  <button id="backupBtn" aria-label="Backup &amp; restore">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 8.5l7.5-4 7.5 4v8l-7.5 4-7.5-4z"/><path d="M4.5 8.5l7.5 4 7.5-4M12 12.5v8"/></svg><span class="tip">Backup &amp; restore</span></button>
</aside>

<main id="stage"><canvas id="foam"></canvas><div id="world"></div></main>
<div id="help"></div>



<section id="doneView" hidden><div class="dwrap" id="doneInner"></div></section>


<div id="pin"><svg viewBox="0 0 48 48" fill="none" stroke="#ffa424" stroke-linecap="square">
  <circle cx="24" cy="24" r="13" stroke-width="1.6" stroke-dasharray="6 4"/>
  <path d="M24 2v12M24 34v12M2 24h12M34 24h12" stroke-width="2"/><circle cx="24" cy="24" r="1.8" fill="#fff" stroke="none"/></svg></div>

<div id="editBar" class="glass" hidden><span class="k" id="ebKind">New task</span><textarea id="ebInput" rows="1" maxlength="120" enterkeyhint="done" autocomplete="off" autocorrect="on" autocapitalize="sentences" spellcheck="true" aria-label="Bubble text"></textarea><button class="cx" id="ebCancel" aria-label="Cancel">×</button><button class="btn primary" id="ebDone">Done</button></div>
<button id="zoomHint" class="glass">reset zoom</button>
<div class="veil" id="backup" hidden>
  <div class="sheet glass" role="dialog" aria-labelledby="bkTitle" style="position:relative">
    <button class="x" id="bkClose" aria-label="Close">×</button>
    <h2 id="bkTitle">Backup &amp; restore</h2>
    <p>Your bubbles live on this device. Save a backup here, then restore it on your phone (or anywhere else).</p>
    <h3>Save a backup</h3>
    <div class="row"><button class="btn primary" id="bkDownload">Download file</button><button class="btn" id="bkCopy">Copy as text</button></div>
    <h3>Restore</h3>
    <div class="row"><button class="btn" id="bkPick">Choose a file…</button><input type="file" id="bkFile" accept=".json,application/json,text/plain" hidden></div>
    <textarea id="bkText" placeholder="…or paste backup text here" spellcheck="false"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn" id="bkRestore">Restore from text</button></div>
    <div class="msg" id="bkMsg" role="status"></div>
  </div>
</div>
<div id="toast" class="glass"></div>
<div class="crt" aria-hidden="true"></div>

<script>
(()=>{
const KEY='bubble-day-v1';
const CR=128;                                   // radius of the date bubble (world units)
const HUES=[205,330,150,35,265,5,175,90];
const TAU=Math.PI*2;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=s=>document.querySelector(s);
const stage=$('#stage'),canvas=$('#foam'),ctx=canvas.getContext('2d'),world=$('#world'),helpEl=$('#help'),toastEl=$('#toast');

/* =================== state =================== */
const TRANSIENT=new Set(['vx','vy','rr','rr0','rv','phase','rot','spin','lx','ly','cx','cy','re','shakeT','dying','_fv','_budget','_in','_seed']);
let state=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.groups)return s}catch(e){}
  return {groups:[],tasks:[],done:[],lastOpen:null,sound:true};
}
let saveBlocked=false;
function save(){if(saveBlocked)return;try{state.lastOpen=today();localStorage.setItem(KEY,JSON.stringify(state,(k,v)=>TRANSIENT.has(k)?undefined:v))}catch(e){}}
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const dayDiff=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);

const center={id:'center',kind:'center',x:0,y:0,r:CR,rr:CR,rr0:CR,fixed:true,hue:265,phase:0,rot:.7,spin:70000};
let ghosts=[];                                 // bubbles shrinking away after delete/cancel
function prep(n,grow){
  n.vx=0;n.vy=0;n.rv=0;n.r=radius(n);n.rr0=grow?3:n.r;n.rr=n.rr0;
  n.phase=Math.random()*TAU;n.rot=Math.random()*TAU;n.spin=(45+Math.random()*50)*1000;
  n.lx=n.cx=n.x;n.ly=n.cy=n.y;n.re=n.r*.7;
}
function radius(n,txt){
  const len=(txt??n.text??'').length;
  let kids=0,big=0;
  if(n.kind==='group'&&n.id)for(const t of state.tasks)if(t.gid===n.id){kids++;big=Math.max(big,t.r||0)}
  const grow=72+9*Math.min(kids,10);                      // a group inflates with every task it holds
  const min=n.kind==='group'?Math.max(grow,big*.85):52,f=n.kind==='group'?300:250;
  const base=Math.min(n.kind==='group'?Math.max(130,min):130,Math.max(min,1.22*Math.sqrt(Math.max(len,6)*f/Math.PI)));
  return Math.round(Math.min(230,base+(n.boost||0)));   // boost = extra swell so the words fit
}
function normalise(){
  state.groups.forEach(g=>{g.kind='group';g.parent='center'});
  state.tasks.forEach(t=>{t.kind='task';if(!(t.parent&&(t.parent===t.gid||state.tasks.some(x=>x.id===t.parent&&x.gid===t.gid))))t.parent=t.gid;if(t.hue==null)t.hue=(state.groups.find(g=>g.id===t.gid)||{hue:200}).hue});
}
normalise();[...state.groups,...state.tasks].forEach(n=>prep(n));
queueMicrotask(()=>{rebalance();save()});

const live=()=>[center,...state.groups,...state.tasks];
const simNodes=()=>[center,...state.groups,...state.tasks,...ghosts];

/* =================== bubble physics ===================
   Two soap bubbles that touch merge into a "double bubble". Plateau's laws say the
   three films meet at 120°, which puts the centres at d² = r1² + r2² − r1·r2 apart,
   with a shared wall of radius r1·r2/(r2 − r1) that bulges into the bigger bubble.  */

  const A=simNodes();

      let big=0;for(const g of state.groups)big=Math.max(big,g.r);
      n.r=Math.max(CR,Math.round(big*.95));n.rv=((n.rv||0)+(n.r-n.rr)*.07)*.78;n.rr=Math.max(CR*.5,n.rr+n.rv);n.rr0=n.rr;
      motion=Math.max(motion,Math.abs(n.rv));continue}
    if(!n.dying){                                   // groups inflate with tasks; all bubbles swell to fit words
      const ed=editing&&editing.id===n.id;
      n.r=radius(n,ed?els.get(n.id)?.querySelector('.t')?.textContent:undefined);
    }
    const tg=n.dying?0:n.r;
    n.rv=(n.rv+(tg-n.rr0)*.07)*.78;n.rr0=Math.max(0,n.rr0+n.rv);   // springy growth = budding
    n.rr=n.rr0;
    motion=Math.max(motion,Math.abs(n.rv));
  }
  ghosts=ghosts.filter(g=>g.rr0>1);
  for(let i=0;i<A.length;i++)for(let j=i+1;j<A.length;j++){
    const a=A[i],b=A[j],ra=a.rr,rb=b.rr;if(ra<.5||rb<.5)continue;
    let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
    if(d<.01){dx=Math.random()-.5;dy=Math.random()-.5;d=Math.hypot(dx,dy)}
    const ux=dx/d,uy=dy/d,dp=plateau(ra,rb);

    if(linked(a,b)){target=dp;k=.03}                     // parent & child: full double-bubble merge
    else{target=ra+rb-4;if(d>=target)continue;k=.035}       // unrelated bubbles just touch
    const f=(d-target)*k;

    a.vx+=ux*f*ma/mt;a.vy+=uy*f*ma/mt;b.vx-=ux*f*mb/mt;b.vy-=uy*f*mb/mt;
  }
  for(const n of A){
    if(n.fixed)continue;
    if(n.shakeT&&t-n.shakeT<420)n.vx+=Math.sin((t-n.shakeT)/22)*1.6;
    n.vx*=.76;n.vy*=.76;n.x+=n.vx;n.y+=n.vy;motion=Math.max(motion,Math.abs(n.vx)+Math.abs(n.vy));
  }
}

/* -------- merge geometry -------- */
function pairGeom(a,b){
  const ra=a.rr,rb=b.rr,dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);

  const s=ra<=rb?a:b,L=s===a?b:a,rs=s.rr,rL=L.rr;
  const ux=(L.x-s.x)/d,uy=(L.y-s.y)/d;
  const xs=(d*d+rs*rs-rL*rL)/(2*d),h=Math.sqrt(Math.max(0,rs*rs-xs*xs));
  const mx=s.x+ux*xs,my=s.y+uy*xs;
  const g={a,b,s,L,ux,uy,mx,my,h,p1x:mx-uy*h,p1y:my+ux*h,p2x:mx+uy*h,p2y:my-ux*h};
  const dr=rL-rs;let r3=dr>.01?rs*rL/dr:Infinity;
  g.line=r3>4000;
  if(!g.line){if(r3<h*1.001)r3=h*1.001;const off=xs-Math.sqrt(r3*r3-h*h);g.wx=s.x+ux*off;g.wy=s.y+uy*off;g.r3=r3}
  return g;
}
function computeGeo(A){
  const G=new Map(),list=[];A.forEach(n=>G.set(n,[]));
  for(let i=0;i<A.length;i++)for(let j=i+1;j<A.length;j++){
    const g=pairGeom(A[i],A[j]);if(g){list.push(g);G.get(A[i]).push(g);G.get(A[j]).push(g)}

}
const other=(g,n)=>g.a===n?g.b:g.a;
function onSide(g,n,px,py){         // is point on n's side of the shared wall?
  const sSide=g.line?((px-g.mx)*g.ux+(py-g.my)*g.uy)<=0:Math.hypot(px-g.wx,py-g.wy)<=g.r3;
  return n===g.s?sSide:!sSide;
}
const ownerBuf=[];let ownerStamp=0;
function owner(px,py,geo){
  const c=ownerBuf;c.length=0;
  for(const n of geo.A)if(n.rr>1&&(px-n.x)**2+(py-n.y)**2<n.rr*n.rr){c.push(n);n._in=ownerStamp+1}
  ownerStamp++;

  for(const n of c){
    let ok=true;
    for(const g of geo.G.get(n)){if(other(g,n)._in===ownerStamp&&!onSide(g,n,px,py)){ok=false;break}}
    if(ok)return n;
  }
  return c.reduce((m,n)=>((px-n.x)**2+(py-n.y)**2-n.rr*n.rr)<((px-m.x)**2+(py-m.y)**2-m.rr*m.rr)?n:m);
}

    const sg=n===g.s?1:-1,B=Math.hypot(bx-g.mx,by-g.my)+bh*1.5,tx=-g.uy,ty=g.ux,nx=g.ux*sg,ny=g.uy*sg;
    ctx.moveTo(g.mx+tx*B,g.my+ty*B);ctx.lineTo(g.mx+tx*B-nx*B,g.my+ty*B-ny*B);
    ctx.lineTo(g.mx-tx*B-nx*B,g.my-ty*B-ny*B);ctx.lineTo(g.mx-tx*B,g.my-ty*B);ctx.closePath();ctx.clip();
  }else if(n===g.s){ctx.arc(g.wx,g.wy,g.r3,0,TAU);ctx.clip()}
  else{ctx.rect(bx-bh,by-bh,2*bh,2*bh);ctx.moveTo(g.wx+g.r3,g.wy);ctx.arc(g.wx,g.wy,g.r3,0,TAU);ctx.clip('evenodd')}

/* =================== the grid =================== */
const hueOf=n=>n.kind==='task'?(groupOf(n)?.hue??n.hue??200):n.hue;

// every group gets a neon light colour; the date disc is TRON cyan
const neon=n=>n===center?'111,246,255':hslRgb(hueOf(n));
function hslRgb(h){h=((h%360)+360)%360;const f=k=>{const kk=(k+h/30)%12;return 255*(.6-.4*Math.max(-1,Math.min(kk-3,9-kk,1)))};return `${f(0)|0},${f(8)|0},${f(4)|0}`}
const skyC=$('#sky'),sk=skyC.getContext('2d');
function renderSky(){
  const W=innerWidth,H=innerHeight,q=Math.min(2,devicePixelRatio||1);
  skyC.width=Math.round(W*q);skyC.height=Math.round(H*q);
  const g=sk;g.setTransform(q,0,0,q,0,0);
  const hz=H*(W<640?.58:.56),vx=W/2;
  // the void, with a cold glow at the horizon
  let lg=g.createLinearGradient(0,0,0,H);lg.addColorStop(0,'#010205');lg.addColorStop(hz/H*.8,'#031220');lg.addColorStop(hz/H,'#0a3550');lg.addColorStop(Math.min(1,hz/H+.02),'#04121c');lg.addColorStop(1,'#010407');
  g.fillStyle=lg;g.fillRect(0,0,W,H);
  // distant light-lines in the sky (the city / data streams)
  g.save();g.globalCompositeOperation='lighter';
  for(let i=0;i<18;i++){const y=hz*(.25+.7*((i*0.6180339)%1)),x0=W*((i*.37)%1)-W*.2,L=W*(.15+.3*((i*.71)%1));
    lg=g.createLinearGradient(x0,0,x0+L,0);lg.addColorStop(0,'rgba(0,216,255,0)');lg.addColorStop(.5,`rgba(0,216,255,${.05+.08*((i*.29)%1)})`);lg.addColorStop(1,'rgba(0,216,255,0)');
    g.fillStyle=lg;g.fillRect(x0,y,L,1)}

  g.beginPath();g.moveTo(0,hz);
  for(let x=0;x<=W;x+=W/48){const t=x/W,k=Math.round(x/(W/48));g.lineTo(x,hz-(.15+.85*Math.abs(Math.sin(k*2.17)*Math.sin(t*5.3+1.3)))*H*.05)}
  g.lineTo(W,hz);g.closePath();g.fillStyle='#02080e';g.fill();
  g.strokeStyle='rgba(0,216,255,.35)';g.lineWidth=1;g.stroke();
  g.restore();
  // the horizon line
  g.save();g.globalCompositeOperation='lighter';
  for(const [w,a] of [[24,.08],[10,.18],[3,.6],[1.2,1]]){g.fillStyle=`rgba(111,246,255,${a})`;g.fillRect(0,hz-w/2,W,w)}
  // the floor grid, in perspective
  const lines=(stroke)=>{
    g.beginPath();
    for(let i=-40;i<=40;i++){const xb=vx+i*W*.09;g.moveTo(vx+i*W*.004,hz);g.lineTo(xb,H)}
    for(let k=1;k<26;k++){const z=1/(k*.22);const y=hz+(H-hz)*Math.min(1,.06/(z*.06+.0)*(k*.22)*.15+Math.pow(k/25,2.2));if(y>H)break;g.moveTo(0,y);g.lineTo(W,y)}
    stroke()};
  lines(()=>{g.strokeStyle='rgba(0,216,255,.10)';g.lineWidth=6;g.stroke()});
  lines(()=>{g.strokeStyle='rgba(0,216,255,.35)';g.lineWidth=2;g.stroke()});
  lines(()=>{g.strokeStyle='rgba(170,250,255,.85)';g.lineWidth=.8;g.stroke()});
  g.restore();
  // haze: the grid fades into the horizon
  lg=g.createLinearGradient(0,hz,0,hz+(H-hz)*.45);lg.addColorStop(0,'rgba(4,22,34,.85)');lg.addColorStop(1,'rgba(4,22,34,0)');
  g.fillStyle=lg;g.fillRect(0,hz+1,W,(H-hz)*.45);
  // a light-cycle trail streaking across the floor, and a faint orange one far away
  g.save();g.globalCompositeOperation='lighter';
  const trail=(y,x0,x1,c)=>{for(const [w,a] of [[10,.08],[4,.25],[1.5,1]]){lg=g.createLinearGradient(x0,0,x1,0);lg.addColorStop(0,`rgba(${c},0)`);lg.addColorStop(1,`rgba(${c},${a})`);g.fillStyle=lg;g.fillRect(x0,y-w/2,x1-x0,w)}};
  trail(hz+(H-hz)*.62,-W*.1,W*.38,'111,246,255');trail(hz+(H-hz)*.18,W*.62,W*.9,'255,164,36');
  g.restore();
  wake(4);
}
const gridTile=(()=>{const c=document.createElement('canvas');c.width=c.height=24;const g=c.getContext('2d');g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=1;g.beginPath();g.moveTo(.5,0);g.lineTo(.5,24);g.moveTo(0,.5);g.lineTo(24,.5);g.stroke();return c})();
let gridPat=null;
function cellClip(n,pad){
  ctx.beginPath();ctx.arc(n.x,n.y,n.rr+pad,0,TAU);ctx.clip();
  for(const g of geo.G.get(n))clipSide(g,n,n.x,n.y,n.rr+pad+3);

// neon tube: wide faint glow, mid glow, bright white-hot core
function tube(c,w){ctx.strokeStyle=`rgba(${c},.12)`;ctx.lineWidth=w*7;ctx.stroke();ctx.strokeStyle=`rgba(${c},.35)`;ctx.lineWidth=w*3;ctx.stroke();

addEventListener('resize',()=>{clearTimeout(renderSky._t);renderSky._t=setTimeout(renderSky,150)});
renderSky();

/* =================== drawing =================== */
let maxDpr=2,slowFrames=0,uz=1,ux=0,uy=0;const cam={x:0,y:0};
let view={s:1,cx:0,cy:0},cw=0,ch=0,dpr=1,geo={A:[],G:new Map(),list:[]},hover=null,editing=null,tool='cursor';
function fitView(){
  const W=stage.clientWidth,H=stage.clientHeight;
  // fit the whole cluster (not just the space around the date) and centre it
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const n of live()){x0=Math.min(x0,n.x-n.r);x1=Math.max(x1,n.x+n.r);y0=Math.min(y0,n.y-n.r);y1=Math.max(y1,n.y+n.r)}
  const padX=phone()?28:48,padY=phone()?200:150;
  const ts=Math.max(.28,Math.min(1,(W-padX)/(x1-x0),(H-padY)/(y1-y0)));
  const ease=(a,b)=>a==null?b:(Math.abs(b-a)<.002?b:a+(b-a)*.08);
  view.base=ease(view.base,ts);view.mx=ease(view.mx,(x0+x1)/2);view.my=ease(view.my,(y0+y1)/2+(phone()?0:0));
  view.s=view.base*uz;
  // while typing on a phone, slide the board so the bubble sits in the space above the typing bar
  let ex=0,ey=0;
  if(editing&&editing.bar){
    const n=find(editing.id);
    // centre it between the typing bar (top) and the keyboard (bottom of the visible screen)
    if(n){const r=stage.getBoundingClientRect(),vv=visualViewport,top=editBar.getBoundingClientRect().bottom+10,
      bottom=(vv?vv.offsetTop+vv.height:innerHeight)-14;
      ex=W/2-n.x*view.s-(W/2+ux-view.mx*view.s);ey=((top+bottom)/2-r.top)-n.y*view.s-(H/2+uy-view.my*view.s)}
  }
  cam.x+=(ex-cam.x)*.18;cam.y+=(ey-cam.y)*.18;if(Math.abs(ex-cam.x)<.3)cam.x=ex;if(Math.abs(ey-cam.y)<.3)cam.y=ey;
  view.cx=W/2+ux+cam.x-view.mx*view.s;view.cy=H/2+uy+cam.y-view.my*view.s;
  const wt=`translate(${view.cx.toFixed(1)}px,${view.cy.toFixed(1)}px) scale(${view.s.toFixed(4)})`;
  if(wt!==world._t){world.style.transform=wt;world._t=wt;wake(2)}    // only re-render text when the zoom really changes
  const d=Math.min(maxDpr,devicePixelRatio||1);
  if(W*d!==cw||H*d!==ch||d!==dpr){wake(2);dpr=d;cw=canvas.width=Math.round(W*d);ch=canvas.height=Math.round(H*d)}
}
function draw(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cw,ch);

    const isC=n===center,r=n.rr,c=neon(n);

    if(ed&&r>8){ctx.setLineDash([8,6]);ctx.lineDashOffset=-t/30;ctx.beginPath();ctx.arc(n.x,n.y,r-6,0,TAU);ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.5;ctx.stroke();ctx.setLineDash([])}

/* -------- labels (DOM, so they can be typed into) -------- */
const els=new Map();
const centerLab=document.createElement('div');centerLab.className='lab center';
centerLab.innerHTML='<div class="c-wrap"><div class="c-wk"></div><div class="c-day"></div><div class="c-mo"></div><div class="c-stat"></div></div>';
centerLab.style.width='200px';centerLab.style.transform='translate(-50%,-50%)';world.appendChild(centerLab);
const hint=document.createElement('div');hint.className='hint';hint.textContent='▶ Tap the disc to start';world.appendChild(hint);
let frameNo=0;
function centroids(){
  for(const n of geo.A){
    if(n===center||n.dying)continue;
    if(!geo.G.get(n).length){n.cx=n.x;n.cy=n.y;n.re=n.rr;continue}
    const N=7,st=2*n.rr/N;let sx=0,sy=0,c=0,tot=0;
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){
      const px=n.x-n.rr+(i+.5)*st,py=n.y-n.rr+(j+.5)*st;
      if((px-n.x)**2+(py-n.y)**2>n.rr*n.rr)continue;tot++;
      if(owner(px,py,geo)===n){sx+=px;sy+=py;c++}
    }
    if(c){n.cx=sx/c;n.cy=sy/c;n.re=n.rr*Math.sqrt(c/tot)}else{n.cx=n.x;n.cy=n.y;n.re=n.rr*.5}
  }
}

      el.innerHTML='<span class="age" hidden></span><div class="t" spellcheck="false" contenteditable="false"></div>';
      world.appendChild(el);els.set(n.id,el);el.animate([{opacity:0},{opacity:1}],{duration:500,delay:150,fill:'backwards'});
      el.style.setProperty('--c',`rgb(${neon(n)})`);
      n.lx=n.cx??n.x;n.ly=n.cy??n.y;
      el._txt=null;
    }
    n.lx+=((n.cx??n.x)-n.lx)*.35;n.ly+=((n.cy??n.y)-n.ly)*.35;
    const w=Math.max(54,Math.min(240,(n.re||n.rr)*1.45));
    el.style.width=w.toFixed(1)+'px';
    el.style.transform=`translate(${n.lx.toFixed(1)}px,${n.ly.toFixed(1)}px) translate(-50%,-50%)`;
    const lab=el.firstChild.nextSibling;
    if(!(editing&&editing.id===n.id)&&el._txt!==n.text){lab.textContent=n.text;el._txt=n.text}

/* =================== creating (budding) =================== */
function budPoint(parent,prefer){            // the free-est spot on the parent's surface
  let best=null,bs=-1e9;
  for(let k=0;k<36;k++){
    const a=k/36*TAU,ux=Math.cos(a),uy=Math.sin(a),px=parent.x+ux*parent.rr,py=parent.y+uy*parent.rr;
    let free=1e9;
    for(const n of live()){if(n===parent)continue;free=Math.min(free,Math.hypot(px-n.x,py-n.y)-n.rr)}
    const sc=Math.min(free,160)+prefer(ux,uy);
    if(sc>bs){bs=sc;best={ux,uy}}
  }
  return {x:parent.x+best.ux*(parent.rr-4),y:parent.y+best.uy*(parent.rr-4)};
}
function newGroup(text,hue,created){
  const used=state.groups.map(g=>g.hue);
  const h=hue??(HUES.find(x=>!used.includes(x))??HUES[state.groups.length%HUES.length]);
  const g={id:uid(),kind:'group',parent:'center',text:text||'',hue:h,created:created||today()};
  Object.assign(g,budPoint(center,(ux,uy)=>Math.abs(ux)*25));
  prep(g,true);state.groups.push(g);return g;
}
function newTask(g,text,created){
  const t={id:uid(),kind:'task',gid:g.id,parent:g.id,hue:g.hue,text:text||'',created:created||today()};
  // once the group's surface is full, new tasks stack onto the outermost sibling instead
  const direct=state.tasks.filter(x=>x.parent===g.id),room=Math.max(6,Math.floor(radius(g)/15));
  let host=g;
  if(direct.length>=room){
    const kids=x=>state.tasks.filter(y=>y.parent===x.id).length;
    host=state.tasks.filter(x=>x.gid===g.id&&kids(x)<2)
      .sort((a,b)=>(kids(a)-kids(b))||(Math.hypot(b.x-g.x,b.y-g.y)-Math.hypot(a.x-g.x,a.y-g.y)))[0]||g;
    t.parent=host.id;
  }
  const ox0=host===g?g.x:host.x-g.x,oy0=host===g?g.y:host.y-g.y,ol=Math.hypot(ox0,oy0)||1,ox=ox0/ol,oy=oy0/ol;
  Object.assign(t,budPoint(host,(ux,uy)=>(ux*ox+uy*oy)*40));

}
function addGroup(){const g=newGroup();paintCenter();syncLabels();startEdit(g.id,true)}
function addTask(gid){const t=newTask(find(gid),'');paintCenter();syncLabels();startEdit(t.id,true)}
function adopt(n){for(const x of state.tasks)if(x.parent===n.id)x.parent=n.parent;rebalance()}   // stacked tasks re-attach below
function rebalance(){
  for(const g of state.groups){
    const direct=state.tasks.filter(t=>t.parent===g.id),room=Math.max(6,Math.floor(radius(g)/15));
    if(direct.length<=room)continue;
    // keep an evenly spread ring of tasks on the group; the rest move out a layer
    direct.sort((a,b)=>Math.atan2(a.y-g.y,a.x-g.x)-Math.atan2(b.y-g.y,b.x-g.x));
    const keep=new Set();for(let i=0;i<room;i++)keep.add(direct[Math.floor(i*direct.length/room)]);
    const hosts=[...keep],kids=new Map(hosts.map(h=>[h,0]));
    for(const t of state.tasks)if(t.gid===g.id&&t.parent!==g.id&&kids.has(find(t.parent)))kids.set(find(t.parent),kids.get(find(t.parent))+1);
    for(const t of direct){
      if(keep.has(t))continue;
      let best=null,bd=1e9;
      for(const h of hosts){if((kids.get(h)||0)>=2)continue;const d=Math.hypot(h.x-t.x,h.y-t.y);if(d<bd){bd=d;best=h}}
      if(!best)break;
      t.parent=best.id;kids.set(best,(kids.get(best)||0)+1);hosts.push(t);kids.set(t,0);
      // start it just outside its new host so it slides into place
      const ol=Math.hypot(best.x-g.x,best.y-g.y)||1;t.x=best.x+(best.x-g.x)/ol*best.rr*.6;t.y=best.y+(best.y-g.y)/ol*best.rr*.6;t.vx=t.vy=0;

}

function toWorld(e){const r=stage.getBoundingClientRect();return [(e.clientX-r.left-view.cx)/view.s,(e.clientY-r.top-view.cy)/view.s]}

  const r=stage.getBoundingClientRect(),P=[...ptrs.values()];

/* =================== popping =================== */

  dropLabel(n.id);popFx(n,h,hx??n.x,hy??n.y);popSound();

  for(const q of live())if(!q.fixed){const dx=q.x-n.x,dy=q.y-n.y,d=Math.hypot(dx,dy)||1;if(d<n.rr+q.rr){q.vx-=dx/d*1.5;q.vy-=dy/d*1.5}}

      const x=pad+r+v.x+v.vx*tt,y=pad+r+v.y+v.vy*tt+.00035*tt*tt*r,sz=(step-1)*(1-k*.6);
      g.fillStyle=`rgba(${c},${(v.edge?1:.55)*(1-k)*flick})`;g.fillRect(x,y,sz,sz);
      if(v.edge){g.fillStyle=`rgba(255,255,255,${(1-k)*.8*flick})`;g.fillRect(x+sz*.3,y+sz*.3,sz*.4,sz*.4)}}
    if(t<900)requestAnimationFrame(derez);else cv.remove();
  })();
  // --- +100
  const sp=document.createElement('div');sp.className='score-pop';sp.textContent='+100';sp.style.transform=`translate(${n.x}px,${n.y}px) translate(-50%,-50%)`;world.appendChild(sp);
  sp.animate([{opacity:0,translate:'0 10px',scale:.6},{opacity:1,translate:'0 0',scale:1.15,offset:.2},{opacity:1,translate:'0 -30px',scale:1,offset:.7},{opacity:0,translate:'0 -50px',scale:1}],{duration:900,easing:'ease-out'}).onfinish=()=>sp.remove();
  const sc=$('#score');sc.animate([{transform:'scale(1.25)',color:'#ffa424'},{transform:'scale(1)'}],{duration:300});
}
let actx=null;
function popSound(){
  if(!state.sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const t=actx.currentTime+.005,out=actx.createGain();out.gain.value=.55;out.connect(actx.destination);
    // 1. "pew": a square + saw zap sweeping down
    for(const [type,det] of [['square',0],['sawtooth',7]]){const o=actx.createOscillator(),g=actx.createGain(),f=actx.createBiquadFilter();
      o.type=type;o.detune.value=det;o.frequency.setValueAtTime(1900,t);o.frequency.exponentialRampToValueAtTime(140,t+.17);
      f.type='lowpass';f.frequency.setValueAtTime(6000,t);f.frequency.exponentialRampToValueAtTime(900,t+.17);
      g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.22,t+.005);g.gain.exponentialRampToValueAtTime(.001,t+.19);
      o.connect(f);f.connect(g);g.connect(out);o.start(t);o.stop(t+.2)}
    // 2. derez crunch: lo-fi noise (an 8 kHz buffer, so it sounds bit-crushed)
    const sr=8000,n=Math.floor(sr*.22),buf=actx.createBuffer(1,n,sr),d=buf.getChannelData(0);
    for(let i=0;i<n;i++){const hold=Math.floor(i/3)*3;d[i]=(((Math.sin(hold*12.9898)*43758.5453)%1)*2-1)*Math.pow(1-i/n,2)}
    const src=actx.createBufferSource(),ng=actx.createGain();src.buffer=buf;ng.gain.value=.35;src.connect(ng);ng.connect(out);src.start(t+.08);
    // 3. a quick falling arpeggio, arcade style
    [880,659,523,392].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=f;
      const ts=t+.1+i*.045;g.gain.setValueAtTime(.0001,ts);g.gain.linearRampToValueAtTime(.12,ts+.004);g.gain.exponentialRampToValueAtTime(.001,ts+.05);
      o.connect(g);g.connect(out);o.start(ts);o.stop(ts+.06)});
  }catch(e){}
}

/* =================== tools / tabs / toast =================== */
const HELP={
  cursor:'Tap the date to add a group · tap a group to add tasks · tap a task or hold a group to rename',
  pin:'Laser armed: tap a task to derez it (+100)',
  erase:'Tap any bubble to delete it (groups take their tasks with them)'
};
const HELP_M={cursor:'tap the date → group · tap a group → task · hold to rename',pin:'laser armed · tap a task to derez it',erase:'tap a block to delete it'};
const phone=()=>innerWidth<640;
function paintHelp(){
  helpEl.textContent=(phone()?HELP_M:HELP)[tool];
  helpEl.style.visibility=(editing&&editing.bar)||(!state.groups.length&&tool==='cursor')?'hidden':'';
}
function setTool(t){
  wake();
  if(editing)commitEdit();
  tool=t;document.body.classList.remove('pin','erase');if(t!=='cursor')document.body.classList.add(t);
  document.querySelectorAll('[data-tool]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tool===t));
  paintHelp();stage.style.cursor=t==='pin'?'none':t==='erase'?'crosshair':'default';
}
$('#tools').addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(b)setTool(b.dataset.tool)});
function paintSound(){$('#soundBtn').setAttribute('aria-pressed',state.sound);$('#wave').style.display=state.sound?'':'none'}
$('#soundBtn').addEventListener('click',()=>{state.sound=!state.sound;paintSound();save();if(state.sound)popSound()});
addEventListener('keydown',e=>{
  if(editing||e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==='v')setTool('cursor');if(k==='p')setTool('pin');if(k==='x')setTool('erase');if(k==='escape')setTool('cursor');
});
let onDone=false;
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{
  if(editing)commitEdit();
  document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));
  onDone=b.dataset.tab==='done';
  stage.style.visibility=onDone?'hidden':'';$('#doneView').hidden=!onDone;$('#tools').style.display=onDone?'none':'';
  helpEl.style.display=onDone?'none':'';
  if(onDone)renderDone();else wake(4);
}));
let toastT;
function toast(msg,undo){
  toastEl.textContent=msg;
  if(undo){const b=document.createElement('button');b.textContent='Undo';b.onclick=()=>{undo();toastEl.classList.remove('show')};toastEl.appendChild(b)}
  toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),undo?6000:3500);
}

/* =================== completed tab =================== */
function renderDone(){
  const root=$('#doneInner');root.innerHTML='';
  const days={};state.done.slice().sort((a,b)=>b.completed-a.completed).forEach(d=>{(days[ymd(new Date(d.completed))]??=[]).push(d)});
  const keys=Object.keys(days).sort().reverse(),t=today();
  let streak=0,cur=new Date();if(!days[t])cur.setDate(cur.getDate()-1);
  while(days[ymd(cur)]){streak++;cur.setDate(cur.getDate()-1)}
  const el=(tag,cls,txt)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(txt!=null)x.textContent=txt;return x};
  const stats=el('div','stats');
  [[(days[t]||[]).length,'popped today'],[state.done.length,'all time'],[streak,'day streak 🔥']].forEach(([n,l])=>{const s=el('div','stat');s.append(el('b',null,n),el('span',null,l));stats.append(s)});
  root.append(stats);
  const wk=el('div','week'),counts=[];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);counts.push([d,(days[ymd(d)]||[]).length])}
  const max=Math.max(1,...counts.map(c=>c[1]));
  counts.forEach(([d,c],i)=>{const col=el('div',i===6?'t':'');const bar=el('i');bar.style.height=(c?8+c/max*46:4)+'px';bar.style.opacity=c?1:.25;
    col.append(el('span',null,c||''),bar,el('span',null,d.toLocaleDateString(undefined,{weekday:'narrow'})));wk.append(col)});
  root.append(wk);
  if(!keys.length){root.append(el('div','empty','No tasks derezzed yet.\nArm the laser and blast a task —\nit lands here as your daily log.'));return}
  keys.forEach(k=>{
    const sec=el('div','day'),h=el('h3'),diff=dayDiff(k,t);
    const label=diff===0?'Today':diff===1?'Yesterday':new Date(k+'T12:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
    h.append(el('div',null,label),el('span',null,days[k].length+' done'));sec.append(h);
    days[k].forEach((d,i)=>{
      const it=el('div','item');it.style.setProperty('--h',d.hue);it.style.animationDelay=Math.min(i*30,300)+'ms';
      const body=el('div','tx',d.text);
      body.append(document.createElement('br'),el('span','chip',d.group||(d.kind==='group'?'Group':'Task')));
      const u=el('button','undo','↩');u.title='Put this bubble back';u.onclick=()=>restore(d.id);
      it.append(el('div','tick','✓'),body,el('div','when',new Date(d.completed).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})),u);sec.append(it);
    });
    root.append(sec);
  });
}
function restore(id){
  const d=state.done.find(x=>x.id===id);if(!d)return;
  if(d.kind==='group')newGroup(d.text,d.hue,d.created);
  else{let g=state.groups.find(x=>x.id===d.gid);if(!g)g=newGroup(d.group||'Restored',d.hue,d.created);newTask(g,d.text,d.created)}
  state.done=state.done.filter(x=>x!==d);
  paintCenter();save();renderDone();toast('Bubble put back on the board');
}

/* =================== pin cursor =================== */
const pinEl=$('#pin');
let px=0,py=0;
addEventListener('pointermove',e=>{
  px=e.clientX;py=e.clientY;
  if(e.pointerType==='mouse'){document.body.classList.add('hasmouse');
    pinEl.style.visibility=e.target.closest&&e.target.closest('.tools,.top')?'hidden':'visible';
    pinEl.style.transform=`translate(${px-24}px,${py-24}px)`}
});
addEventListener('pointerdown',e=>{if(tool==='pin'){pinEl.classList.add('stab');setTimeout(()=>pinEl.classList.remove('stab'),130)}
  if(e.pointerType!=='mouse')document.body.classList.remove('hasmouse')});
document.documentElement.addEventListener('pointerleave',()=>{pinEl.style.visibility='hidden'});

/* =================== day roll-over =================== */
let shownDay=today();
function checkDay(){
  const t=today();
  if(t!==shownDay){shownDay=t;paintCenter();if(state.tasks.length||state.groups.length)toast('☀️ New day! Your unpopped bubbles rolled over.')}
}
setInterval(checkDay,20000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else checkDay()});
addEventListener('pagehide',save);
setInterval(save,15000);

/* =================== main loop =================== */
let last=performance.now(),acc=0;
function frame(t){
  acc+=Math.min(80,t-last);last=t;
  motion=0;while(acc>=16.67){step(t);acc-=16.67}
  if(!onDone){
    fitView();
    if(motion>.015||wakeN>0||!state.groups.length){
      const q=performance.now();draw(t);frameNo++;syncLabels();if(wakeN>0)wakeN--;
      // on a slow device, drop canvas resolution rather than stutter
      if(performance.now()-q>22){if(++slowFrames>20&&maxDpr>1){maxDpr=Math.max(1,maxDpr-.5);slowFrames=0}}else slowFrames=Math.max(0,slowFrames-1);
    }
  }
  requestAnimationFrame(frame);
}
paintSound();setTool('cursor');paintCenter();fitView();
for(let i=0;i<200;i++)step(0);                 // settle a saved board before first paint
requestAnimationFrame(frame);
if(state.lastOpen&&state.lastOpen!==today()&&(state.tasks.length||state.groups.length)){
  const days=dayDiff(state.lastOpen,today()),n=state.tasks.length+state.groups.length;
  setTimeout(()=>toast(`☀️ New day — ${n} bubble${n>1?'s':''} rolled over from ${days===1?'yesterday':days+' days ago'}`),600);
}
save();

addEventListener('resize',()=>{wake(4);paintHelp()});

/* =================== backup & restore =================== */
const bk=$('#backup'),bkMsg=$('#bkMsg');
const backupText=()=>JSON.stringify({app:'bubble-day',v:1,saved:new Date().toISOString(),data:JSON.parse(JSON.stringify(state,(k,v)=>TRANSIENT.has(k)?undefined:v))});
function openBackup(){if(editing)commitEdit();bkMsg.textContent='';$('#bkText').value='';bk.hidden=false}
if(window.top!==window)$('#bkDownload').hidden=true;   // embedded pages can't download files: offer copy instead
$('#backupBtn').addEventListener('click',openBackup);
$('#bkClose').addEventListener('click',()=>bk.hidden=true);
bk.addEventListener('click',e=>{if(e.target===bk)bk.hidden=true});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!bk.hidden)bk.hidden=true});
$('#bkDownload').addEventListener('click',()=>{
  try{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([backupText()],{type:'application/json'}));
    a.download=`bubble-day-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    bkMsg.textContent='Backup file saved ✓  (if nothing downloaded, use “Copy as text”)';
  }catch(e){bkMsg.textContent='Downloads are blocked here: use “Copy as text” instead.'}
});
$('#bkCopy').addEventListener('click',async()=>{
  const txt=backupText();
  try{await navigator.clipboard.writeText(txt);bkMsg.textContent='Copied ✓  Paste it into Bubble Day on your other device.'}
  catch(e){const ta=$('#bkText');ta.value=txt;ta.select();bkMsg.textContent='Couldn’t copy automatically: the backup is in the box below, copy it from there.'}
});
$('#bkPick').addEventListener('click',()=>$('#bkFile').click());
$('#bkFile').addEventListener('change',async e=>{const f=e.target.files[0];if(f)restoreFrom(await f.text());e.target.value=''});
$('#bkRestore').addEventListener('click',()=>restoreFrom($('#bkText').value));
function restoreFrom(txt){
  let o;try{o=JSON.parse(txt.trim())}catch(e){bkMsg.textContent='That doesn’t look like a Bubble Day backup.';return}
  const d=o&&o.data?o.data:o;
  if(!d||!Array.isArray(d.groups)||!Array.isArray(d.tasks)||!Array.isArray(d.done)){bkMsg.textContent='That doesn’t look like a Bubble Day backup.';return}
  const n=d.groups.length+d.tasks.length;
  if((state.groups.length||state.tasks.length||state.done.length)&&!bkMsg.dataset.confirm){
    bkMsg.dataset.confirm='1';bkMsg.textContent=`This replaces the bubbles on this device with the backup (${n} bubbles, ${d.done.length} completed). Tap restore again to confirm.`;
    setTimeout(()=>delete bkMsg.dataset.confirm,8000);return;
  }
  saveBlocked=true;   // stop the page saving its old board over the backup while it reloads
  try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){saveBlocked=false;bkMsg.textContent='Couldn’t save on this device.';return}
  bkMsg.textContent='Restored ✓';setTimeout(()=>location.reload(),400);
}

/* =================== installable app: work offline =================== */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&window.top===window){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
window.__bd={skyC,neon,get motion(){return motion},get frames(){return frameNo},state,newGroup,newTask,setTool,pop,find,get geo(){return geo},center};
})();
