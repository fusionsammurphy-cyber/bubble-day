<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bubble Day</title>
<meta name="theme-color" content="#5aa9e6">
<meta name="description" content="A daily to-do list made of soap bubbles.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bubble Day">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f2c47;--glass:rgba(255,255,255,.30);--glass-b:rgba(255,255,255,.62);--sun:#ffd257}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
  background:linear-gradient(#2a7fd0,#6db6ee 55%,#cfe8f8 76%,#7bb35a 80%,#3f7a2d)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);
  border:1px solid var(--glass-b);border-radius:22px;box-shadow:0 10px 30px rgba(15,60,110,.20),inset 0 1px 0 rgba(255,255,255,.7)}

/* top bar */
.top{position:fixed;top:0;left:0;right:0;height:calc(64px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:center;z-index:30;padding-top:env(safe-area-inset-top)}
.tabs{display:flex;gap:4px;padding:4px;border-radius:99px}
.tabs button{padding:7px 18px;border-radius:99px;font-weight:800;font-size:15px;opacity:.75;transition:.2s}
.tabs button.on{opacity:1;background:rgba(255,255,255,.92);box-shadow:0 2px 10px rgba(15,60,110,.18)}
.tabs .n{display:inline-block;min-width:22px;margin-left:6px;padding:0 7px;border-radius:99px;background:rgba(15,44,71,.12);font-size:12px}

/* tools */
.tools{position:fixed;left:14px;top:50%;transform:translateY(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:28px}
.tools button{width:48px;height:48px;display:grid;place-items:center;opacity:.8;position:relative;border-radius:50%;transition:.2s}
.tools button svg{width:26px;height:26px}
.tools button:hover{opacity:1;background:rgba(255,255,255,.35)}
.tools button[aria-pressed=true]{opacity:1;background:rgba(255,255,255,.95);box-shadow:0 3px 12px rgba(15,60,110,.22)}
.tools .sep{height:1px;background:rgba(15,44,71,.18);margin:2px 8px}
.tools button .tip{position:absolute;left:60px;white-space:nowrap;background:rgba(15,44,71,.85);color:#fff;padding:4px 10px;border-radius:10px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.15s;transform:translateX(-4px)}
.tools button:hover .tip{opacity:1;transform:none}

/* stage: a canvas renders the foam, labels float above it */
#stage{position:fixed;top:calc(64px + env(safe-area-inset-top));left:0;right:0;bottom:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;z-index:2}
#foam{position:absolute;inset:0;width:100%;height:100%}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;pointer-events:none}
.lab{will-change:transform;position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none;transition:opacity .3s}
.lab .t{font-weight:800;line-height:1.12;outline:none;overflow-wrap:normal;hyphens:manual;max-width:none;min-width:1ch;color:#fff;
  text-shadow:0 1px 2px rgba(5,30,60,.55),0 0 14px rgba(5,40,80,.35);caret-color:#fff;letter-spacing:.005em}
.lab.group .t{font-size:20px;font-weight:900}
.lab.task .t{font-size:16.5px}
.lab .t:empty::before{content:attr(data-ph);opacity:.65}
.lab.editing{pointer-events:auto}
.lab.editing .t{cursor:text}
.age{font-size:11px;font-weight:800;padding:1px 8px;margin-bottom:3px;border-radius:99px;white-space:nowrap;color:var(--ink);background:rgba(255,255,255,.75);box-shadow:0 1px 4px rgba(5,30,60,.2)}
.age[hidden]{display:none}
.c-wrap{display:flex;flex-direction:column;align-items:center;line-height:1;color:#fff;text-shadow:0 1px 3px rgba(5,30,60,.5),0 0 18px rgba(5,40,80,.35)}
.c-wk{font-size:20px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.c-day{font-size:78px;font-weight:900;margin:2px 0}
.c-mo{font-size:19px;font-weight:800}
.c-stat{font-size:13px;font-weight:800;opacity:.9;margin-top:8px}
.hint{position:absolute;width:300px;margin-left:-150px;text-align:center;font-size:18px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(5,30,60,.5),0 0 14px rgba(5,40,80,.4);pointer-events:none;transition:opacity .4s}
.popc{position:absolute;left:0;top:0;pointer-events:none}

#help{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));text-align:center;font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(5,30,60,.6);opacity:.9;pointer-events:none;z-index:5;padding:0 80px}

/* pin */
#pin{position:fixed;left:0;top:0;width:48px;height:48px;z-index:40;pointer-events:none;display:none;will-change:transform}
body.pin.hasmouse #pin{display:block}
#pin svg{width:48px;height:48px;transform-origin:24px 46px;transform:rotate(30deg);transition:transform .08s;filter:drop-shadow(3px 5px 4px rgba(10,40,70,.35))}
#pin.stab svg{transform:rotate(30deg) translateY(6px) scale(.92)}

/* typing bar (phones) */
#editBar{position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));z-index:70;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;border-radius:20px;background:rgba(255,255,255,.72)}
#editBar[hidden]{display:none}
#editBar .k{font-size:13px;font-weight:800;opacity:.6;white-space:nowrap}
#editBar textarea{flex:1;min-width:0;resize:none;overflow:hidden;height:36px;line-height:34px;white-space:nowrap;font:800 19px "Nunito",system-ui,sans-serif;color:var(--ink);background:transparent;border:0;border-bottom:2px solid rgba(15,44,71,.18);outline:none;padding:0 2px;caret-color:#1d7fe0}
#editBar .btn{padding:6px 14px;font-size:15px}
#editBar .cx{font-size:24px;opacity:.5;padding:0 4px}
#zoomHint{position:fixed;right:12px;top:calc(74px + env(safe-area-inset-top));z-index:20;font-size:13px;font-weight:800;padding:6px 12px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .3s}
#zoomHint.on{opacity:1;pointer-events:auto}

/* backup sheet */
.veil{position:fixed;inset:0;z-index:60;background:rgba(10,40,70,.25);display:grid;place-items:center;padding:20px}
.veil[hidden]{display:none}
.sheet{width:min(440px,100%);padding:20px 22px 18px;max-height:90vh;overflow:auto;background:rgba(255,255,255,.62)}
.sheet h2{margin:0 0 4px;font-size:24px;font-weight:900}
.sheet p{margin:4px 0 12px;font-size:15px;opacity:.75;line-height:1.35}
.sheet h3{margin:14px 0 6px;font-size:15px;font-weight:900}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-size:15px;font-weight:800;padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(15,60,110,.15)}
.btn:hover,.btn:focus-visible{background:#fff}
.btn.primary{background:linear-gradient(#3aa0f3,#1b7fdc);color:#fff}
.sheet textarea{width:100%;height:86px;margin-top:8px;font:13px/1.3 ui-monospace,Menlo,monospace;color:var(--ink);background:rgba(255,255,255,.7);border:1px solid rgba(15,44,71,.2);border-radius:12px;padding:8px;resize:vertical}
.sheet .x{position:absolute;right:14px;top:10px;font-size:26px;opacity:.5}
.sheet .msg{min-height:22px;margin-top:8px;font-size:15px;font-weight:700}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:50;padding:10px 18px;border-radius:18px;font-size:15px;font-weight:800;display:flex;gap:14px;align-items:center;transition:.3s;pointer-events:none;max-width:90vw;background:rgba(255,255,255,.78)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{font-weight:900;color:#1b7fdc}

/* completed view */
#doneView{position:fixed;top:calc(64px + env(safe-area-inset-top));left:0;right:0;bottom:0;overflow:auto;z-index:10;padding:14px 16px 60px}
#doneView[hidden]{display:none}
.dwrap{max-width:720px;margin:0 auto;padding:18px 20px 26px;background:rgba(255,255,255,.55);border-radius:26px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{padding:12px 8px;text-align:center;border-radius:18px;background:rgba(255,255,255,.65);box-shadow:inset 0 1px 0 #fff}
.stat b{display:block;font-size:30px;font-weight:900;line-height:1.05}
.stat span{font-size:12px;font-weight:800;opacity:.65}
.week{display:flex;gap:10px;align-items:flex-end;height:96px;padding:10px 12px 6px;margin-bottom:18px;border-radius:18px;background:rgba(255,255,255,.45)}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;font-size:12px;font-weight:800}
.week i{display:block;width:62%;max-width:26px;min-height:4px;border-radius:99px;background:linear-gradient(#7cc8ff,#2a8ae6)}
.week div.t i{background:linear-gradient(#ffe27a,#ffb02e)}
.day{margin-bottom:18px}
.day h3{margin:0 0 6px;font-size:18px;font-weight:900;display:flex;justify-content:space-between;align-items:baseline}
.day h3 span{opacity:.55;font-size:13px}
.item{display:flex;align-items:center;gap:12px;padding:9px 10px;margin-bottom:6px;border-radius:16px;background:rgba(255,255,255,.6);animation:fadein .4s both}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
.tick{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px;text-shadow:0 1px 2px rgba(0,0,0,.35);
  background:radial-gradient(circle at 32% 28%,#fff 0 9%,transparent 22%),conic-gradient(from 200deg,hsl(var(--h),90%,70%),hsl(calc(var(--h) + 120),90%,72%),hsl(calc(var(--h) + 240),90%,70%),hsl(var(--h),90%,70%));box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}
.item .tx{flex:1;min-width:0;overflow-wrap:anywhere;font-size:16px;font-weight:800;line-height:1.2}
.chip{font-size:11px;font-weight:800;padding:1px 9px;margin-left:6px;display:inline-block;border-radius:99px;color:hsl(var(--h),55%,28%);background:hsla(var(--h),80%,75%,.45);vertical-align:2px}
.when{font-size:12px;font-weight:700;opacity:.6;white-space:nowrap}
.item .undo{opacity:.5;padding:2px 8px;font-size:18px}
.item .undo:hover{opacity:1}
.empty{text-align:center;opacity:.8;padding:40px 10px;font-size:17px;font-weight:800;line-height:1.4;white-space:pre-line}

@media (max-width:640px){
  .tools{left:50%;top:auto;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);flex-direction:row}
  .tools .sep{width:1px;height:auto;margin:8px 2px}
  .tools button .tip{display:none}
  #help{bottom:calc(86px + env(safe-area-inset-bottom));padding:0 20px;font-size:12px}
  #toast{bottom:calc(120px + env(safe-area-inset-bottom))}
  .dwrap{padding:14px 12px 22px}
}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<header class="top">
  <nav class="tabs glass">
    <button data-tab="bubbles" class="on">Bubbles</button>
    <button data-tab="done">Completed<span class="n" id="doneCount">0</span></button>
  </nav>
</header>

<aside class="tools glass" id="tools">
  <button data-tool="cursor" aria-pressed="true" aria-label="Cursor">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 7-6 2-2 6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span class="tip">Cursor · V</span></button>
  <button data-tool="pin" aria-pressed="false" aria-label="Pin: pop bubbles">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l-1 6 3 3H7l3-3z"/><path d="M12 12v9"/></svg><span class="tip">Pin – pop bubbles · P</span></button>
  <button data-tool="erase" aria-pressed="false" aria-label="Delete">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg><span class="tip">Delete bubble · X</span></button>
  <div class="sep"></div>
  <button id="soundBtn" aria-pressed="true" aria-label="Sound">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="wave" d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></svg><span class="tip">Pop sound</span></button>
  <button id="backupBtn" aria-label="Backup &amp; restore">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 8.5l7.5-4 7.5 4v8l-7.5 4-7.5-4z"/><path d="M4.5 8.5l7.5 4 7.5-4M12 12.5v8"/></svg><span class="tip">Backup &amp; restore</span></button>
</aside>

<main id="stage"><canvas id="foam"></canvas><div id="world"></div></main>
<div id="help"></div>



<section id="doneView" hidden><div class="dwrap" id="doneInner"></div></section>


<div id="pin"><svg viewBox="0 0 48 48">
  <defs><linearGradient id="needle" x1="0" x2="1"><stop offset="0" stop-color="#8d96a3"/><stop offset=".45" stop-color="#f4f6f9"/><stop offset="1" stop-color="#6b7480"/></linearGradient>
  <radialGradient id="head" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ff8a8a"/><stop offset=".45" stop-color="#e3262f"/><stop offset="1" stop-color="#8e0f17"/></radialGradient></defs>
  <path d="M23 29h2l-.6 17.5h-.8z" fill="url(#needle)"/>
  <ellipse cx="24" cy="27.5" rx="12" ry="3.2" fill="url(#head)"/>
  <path d="M16.5 26.5l2.6-12.5h9.8l2.6 12.5z" fill="url(#head)"/>
  <rect x="14" y="5.5" width="20" height="9.5" rx="4.7" fill="url(#head)"/>
  <ellipse cx="19.5" cy="8.6" rx="3.6" ry="1.6" fill="#fff" opacity=".7"/></svg></div>

<div id="editBar" class="glass" hidden><span class="k" id="ebKind">New task</span><textarea id="ebInput" rows="1" maxlength="120" enterkeyhint="done" autocomplete="off" autocorrect="on" autocapitalize="sentences" spellcheck="true" aria-label="Bubble text"></textarea><button class="cx" id="ebCancel" aria-label="Cancel">×</button><button class="btn primary" id="ebDone">Done</button></div>
<button id="zoomHint" class="glass">reset zoom</button>
<div class="veil" id="backup" hidden>
  <div class="sheet glass" role="dialog" aria-labelledby="bkTitle" style="position:relative">
    <button class="x" id="bkClose" aria-label="Close">×</button>
    <h2 id="bkTitle">Backup &amp; restore</h2>
    <p>Your bubbles live on this device. Save a backup here, then restore it on your phone (or anywhere else).</p>
    <h3>Save a backup</h3>
    <div class="row"><button class="btn primary" id="bkDownload">Download file</button><button class="btn" id="bkCopy">Copy as text</button></div>
    <h3>Restore</h3>
    <div class="row"><button class="btn" id="bkPick">Choose a file…</button><input type="file" id="bkFile" accept=".json,application/json,text/plain" hidden></div>
    <textarea id="bkText" placeholder="…or paste backup text here" spellcheck="false"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn" id="bkRestore">Restore from text</button></div>
    <div class="msg" id="bkMsg" role="status"></div>
  </div>
</div>
<div id="toast"></div>

<script>
(()=>{
const KEY='bubble-day-v1';
const CR=128;                                   // radius of the date bubble (world units)
const HUES=[205,330,150,35,265,5,175,90];
const TAU=Math.PI*2;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=s=>document.querySelector(s);
const stage=$('#stage'),canvas=$('#foam'),ctx=canvas.getContext('2d'),world=$('#world'),helpEl=$('#help'),toastEl=$('#toast');

/* =================== state =================== */
const TRANSIENT=new Set(['vx','vy','rr','rr0','rv','phase','rot','spin','lx','ly','cx','cy','re','shakeT','dying','_fv','_budget','_in','_seed']);
let state=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.groups)return s}catch(e){}
  return {groups:[],tasks:[],done:[],lastOpen:null,sound:true};
}
let saveBlocked=false;
function save(){if(saveBlocked)return;try{state.lastOpen=today();localStorage.setItem(KEY,JSON.stringify(state,(k,v)=>TRANSIENT.has(k)?undefined:v))}catch(e){}}
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const dayDiff=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);

const center={id:'center',kind:'center',x:0,y:0,r:CR,rr:CR,rr0:CR,fixed:true,hue:265,phase:0,rot:.7,spin:70000};
let ghosts=[];                                 // bubbles shrinking away after delete/cancel
function prep(n,grow){
  n.vx=0;n.vy=0;n.rv=0;n.r=radius(n);n.rr0=grow?3:n.r;n.rr=n.rr0;
  n.phase=Math.random()*TAU;n.rot=Math.random()*TAU;n.spin=(45+Math.random()*50)*1000;
  n.lx=n.cx=n.x;n.ly=n.cy=n.y;n.re=n.r*.7;
}
function radius(n,txt){
  const len=(txt??n.text??'').length;
  let kids=0,big=0;
  if(n.kind==='group'&&n.id)for(const t of state.tasks)if(t.gid===n.id){kids++;big=Math.max(big,t.r||0)}
  const grow=72+9*Math.min(kids,10);                      // a group inflates with every task it holds
  const min=n.kind==='group'?Math.max(grow,big*.85):52,f=n.kind==='group'?300:250;
  const base=Math.min(n.kind==='group'?Math.max(130,min):130,Math.max(min,1.22*Math.sqrt(Math.max(len,6)*f/Math.PI)));
  return Math.round(Math.min(230,base+(n.boost||0)));   // boost = extra swell so the words fit
}
function normalise(){
  state.groups.forEach(g=>{g.kind='group';g.parent='center'});
  state.tasks.forEach(t=>{t.kind='task';if(!(t.parent&&(t.parent===t.gid||state.tasks.some(x=>x.id===t.parent&&x.gid===t.gid))))t.parent=t.gid;if(t.hue==null)t.hue=(state.groups.find(g=>g.id===t.gid)||{hue:200}).hue});
}
normalise();[...state.groups,...state.tasks].forEach(n=>prep(n));
queueMicrotask(()=>{rebalance();save()});

const live=()=>[center,...state.groups,...state.tasks];
const simNodes=()=>[center,...state.groups,...state.tasks,...ghosts];
const find=id=>id==='center'?center:(state.groups.find(g=>g.id===id)||state.tasks.find(t=>t.id===id));
const groupOf=t=>state.groups.find(g=>g.id===t.gid);
const linked=(a,b)=>a.parent===b.id||b.parent===a.id;

/* =================== bubble physics ===================
   Two soap bubbles that touch merge into a "double bubble". Plateau's laws say the
   three films meet at 120°, which puts the centres at d² = r1² + r2² − r1·r2 apart,
   with a shared wall of radius r1·r2/(r2 − r1) that bulges into the bigger bubble.  */
const plateau=(a,b)=>Math.sqrt(a*a+b*b-a*b);
let motion=1,wakeN=10;const wake=(n=3)=>{wakeN=Math.max(wakeN,n)};
function step(t){
  const A=simNodes();
  for(const n of A){
    if(n.fixed){                                      // the date bubble keeps pace with the biggest group
      let big=0;for(const g of state.groups)big=Math.max(big,g.r);
      n.r=Math.max(CR,Math.round(big*.95));n.rv=((n.rv||0)+(n.r-n.rr)*.07)*.78;n.rr=Math.max(CR*.5,n.rr+n.rv);n.rr0=n.rr;
      motion=Math.max(motion,Math.abs(n.rv));continue}
    if(!n.dying){                                   // groups inflate with tasks; all bubbles swell to fit words
      const ed=editing&&editing.id===n.id;
      n.r=radius(n,ed?els.get(n.id)?.querySelector('.t')?.textContent:undefined);
    }
    const tg=n.dying?0:n.r;
    n.rv=(n.rv+(tg-n.rr0)*.07)*.78;n.rr0=Math.max(0,n.rr0+n.rv);   // springy growth = budding
    n.rr=n.rr0;
    motion=Math.max(motion,Math.abs(n.rv));
  }
  ghosts=ghosts.filter(g=>g.rr0>1);
  for(let i=0;i<A.length;i++)for(let j=i+1;j<A.length;j++){
    const a=A[i],b=A[j],ra=a.rr,rb=b.rr;if(ra<.5||rb<.5)continue;
    let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);

    for(const q of geo.G.get(g.b))if(q!==g)clipSide(q,g.b,g.mx,g.my,wb);
    ctx.beginPath();
    if(g.line){ctx.moveTo(g.p1x,g.p1y);ctx.lineTo(g.p2x,g.p2y)}
    else{const a1=Math.atan2(g.p1y-g.wy,g.p1x-g.wx),a2=Math.atan2(g.p2y-g.wy,g.p2x-g.wx);
      let da=a2-a1;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;ctx.arc(g.wx,g.wy,g.r3,a1,a1+da,da<0)}
    const fade=Math.min(1,g.h/10)*(g.a.dying||g.b.dying?.5:1);
    const lg=ctx.createLinearGradient(g.p1x,g.p1y,g.p2x,g.p2y);
    lg.addColorStop(0,'hsla(300,100%,80%,.6)');lg.addColorStop(.35,'hsla(190,100%,80%,.45)');lg.addColorStop(.7,'hsla(60,100%,78%,.5)');lg.addColorStop(1,'hsla(330,100%,80%,.6)');
    ctx.globalAlpha=.55*fade;ctx.strokeStyle=lg;ctx.lineWidth=4;ctx.stroke();
    ctx.globalAlpha=.85*fade;ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=1.1;ctx.stroke();
    ctx.restore();
  }
}

/* -------- labels (DOM, so they can be typed into) -------- */
const els=new Map();
const centerLab=document.createElement('div');centerLab.className='lab center';
centerLab.innerHTML='<div class="c-wrap"><div class="c-wk"></div><div class="c-day"></div><div class="c-mo"></div><div class="c-stat"></div></div>';
centerLab.style.width='200px';centerLab.style.transform='translate(-50%,-50%)';world.appendChild(centerLab);
const hint=document.createElement('div');hint.className='hint';hint.textContent='Tap the date to blow your first bubble';world.appendChild(hint);
let frameNo=0;
function centroids(){
  for(const n of geo.A){
    if(n===center||n.dying)continue;
    if(!geo.G.get(n).length){n.cx=n.x;n.cy=n.y;n.re=n.rr;continue}
    const N=7,st=2*n.rr/N;let sx=0,sy=0,c=0,tot=0;
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){
      const px=n.x-n.rr+(i+.5)*st,py=n.y-n.rr+(j+.5)*st;
      if((px-n.x)**2+(py-n.y)**2>n.rr*n.rr)continue;tot++;
      if(owner(px,py,geo)===n){sx+=px;sy+=py;c++}
    }
    if(c){n.cx=sx/c;n.cy=sy/c;n.re=n.rr*Math.sqrt(c/tot)}else{n.cx=n.x;n.cy=n.y;n.re=n.rr*.5}
  }
}
function syncLabels(){
  if(frameNo%4===0)centroids();
  for(const n of [...state.groups,...state.tasks]){
    let el=els.get(n.id);
    if(!el){
      el=document.createElement('div');el.className='lab '+n.kind;el.dataset.id=n.id;
      el.innerHTML='<span class="age" hidden></span><div class="t" spellcheck="false" contenteditable="false"></div>';
      world.appendChild(el);els.set(n.id,el);el.animate([{opacity:0},{opacity:1}],{duration:500,delay:150,fill:'backwards'});
      n.lx=n.cx??n.x;n.ly=n.cy??n.y;
      el._txt=null;
    }
    n.lx+=((n.cx??n.x)-n.lx)*.35;n.ly+=((n.cy??n.y)-n.ly)*.35;
    const w=Math.max(54,Math.min(240,(n.re||n.rr)*1.45));
    el.style.width=w.toFixed(1)+'px';
    el.style.transform=`translate(${n.lx.toFixed(1)}px,${n.ly.toFixed(1)}px) translate(-50%,-50%)`;
    const lab=el.firstChild.nextSibling;
    if(!(editing&&editing.id===n.id)&&el._txt!==n.text){lab.textContent=n.text;el._txt=n.text}
    if(frameNo%2===0&&Math.abs(n.rr0-n.r)<2.5&&Math.abs(n.vx)+Math.abs(n.vy)<.15)fitWords(n,el,lab);
    lab.dataset.ph=n.kind==='group'?'Group name…':'Task…';
    const days=dayDiff(n.created,today()),age=el.firstChild;
    if(days>0){age.hidden=false;age.textContent='↻ '+days+'d';age.title='Rolled over from '+n.created}else age.hidden=true;
  }

}
/* the film flows around its words: if any edge of the text pokes outside this bubble's
   own cell of the foam, the bubble swells a little; when there is spare room it relaxes */
function fitWords(n,el,lab){
    const rg=document.createRange();rg.selectNodeContents(lab);const bx=rg.getBoundingClientRect();
  const w=Math.max(bx.width/view.s,lab.textContent?0:40),h=el.offsetHeight;if(!w||!h)return;
  const test=m=>{const hw=w/2+m,hh=h/2+m;let bad=0;
    for(const [dx,dy] of [[-hw,-hh],[hw,-hh],[-hw,hh],[hw,hh],[0,-hh],[0,hh],[-hw,0],[hw,0],[-hw/2,-hh],[hw/2,-hh],[-hw/2,hh],[hw/2,hh]])
      if(owner(n.lx+dx,n.ly+dy,geo)!==n)bad++;
    return bad};
  if(n._fv!==fitVer){n._fv=fitVer;n._budget=25}     // a fresh allowance of adjustments after each change
  if(n._budget<=0)return;
  const bad=test(6);
  if(bad){n.boost=Math.min(70,(n.boost||0)+2+bad);n._budget--}
  else if(n.boost>0&&!test(16)){n.boost=Math.max(0,n.boost-1);n._budget--}
  lab.style.overflowWrap=n.r>=190?'anywhere':'';
}
function dropLabel(id){const el=els.get(id);if(!el)return;els.delete(id);el.animate([{opacity:1},{opacity:0}],{duration:200}).onfinish=()=>el.remove()}
let fitVer=0;
function paintCenter(){
  wake(4);fitVer++;if(typeof paintHelp==='function')paintHelp();
  const d=new Date();
  centerLab.querySelector('.c-wk').textContent=d.toLocaleDateString(undefined,{weekday:'long'});
  centerLab.querySelector('.c-day').textContent=d.getDate();
  centerLab.querySelector('.c-mo').textContent=d.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const open=state.tasks.length+state.groups.filter(g=>!state.tasks.some(t=>t.gid===g.id)).length;
  const pt=state.done.filter(x=>ymd(new Date(x.completed))===today()).length;

/* =================== creating (budding) =================== */
function budPoint(parent,prefer){            // the free-est spot on the parent's surface
  let best=null,bs=-1e9;
  for(let k=0;k<36;k++){
    const a=k/36*TAU,ux=Math.cos(a),uy=Math.sin(a),px=parent.x+ux*parent.rr,py=parent.y+uy*parent.rr;
    let free=1e9;
    for(const n of live()){if(n===parent)continue;free=Math.min(free,Math.hypot(px-n.x,py-n.y)-n.rr)}
    const sc=Math.min(free,160)+prefer(ux,uy);
    if(sc>bs){bs=sc;best={ux,uy}}
  }
  return {x:parent.x+best.ux*(parent.rr-4),y:parent.y+best.uy*(parent.rr-4)};
}
function newGroup(text,hue,created){
  const used=state.groups.map(g=>g.hue);
  const h=hue??(HUES.find(x=>!used.includes(x))??HUES[state.groups.length%HUES.length]);
  const g={id:uid(),kind:'group',parent:'center',text:text||'',hue:h,created:created||today()};
  Object.assign(g,budPoint(center,(ux,uy)=>Math.abs(ux)*25));
  prep(g,true);state.groups.push(g);return g;
}
function newTask(g,text,created){
  const t={id:uid(),kind:'task',gid:g.id,parent:g.id,hue:g.hue,text:text||'',created:created||today()};
  // once the group's surface is full, new tasks stack onto the outermost sibling instead
  const direct=state.tasks.filter(x=>x.parent===g.id),room=Math.max(6,Math.floor(radius(g)/15));
  let host=g;
  if(direct.length>=room){
    const kids=x=>state.tasks.filter(y=>y.parent===x.id).length;
    host=state.tasks.filter(x=>x.gid===g.id&&kids(x)<2)
      .sort((a,b)=>(kids(a)-kids(b))||(Math.hypot(b.x-g.x,b.y-g.y)-Math.hypot(a.x-g.x,a.y-g.y)))[0]||g;
    t.parent=host.id;
  }
  const ox0=host===g?g.x:host.x-g.x,oy0=host===g?g.y:host.y-g.y,ol=Math.hypot(ox0,oy0)||1,ox=ox0/ol,oy=oy0/ol;
  Object.assign(t,budPoint(host,(ux,uy)=>(ux*ox+uy*oy)*40));
  prep(t,true);state.tasks.push(t);return t;
}
function addGroup(){const g=newGroup();paintCenter();syncLabels();startEdit(g.id,true)}
function addTask(gid){const t=newTask(find(gid),'');paintCenter();syncLabels();startEdit(t.id,true)}
function adopt(n){for(const x of state.tasks)if(x.parent===n.id)x.parent=n.parent;rebalance()}   // stacked tasks re-attach below
function rebalance(){
  for(const g of state.groups){
    const direct=state.tasks.filter(t=>t.parent===g.id),room=Math.max(6,Math.floor(radius(g)/15));
    if(direct.length<=room)continue;
    // keep an evenly spread ring of tasks on the group; the rest move out a layer
    direct.sort((a,b)=>Math.atan2(a.y-g.y,a.x-g.x)-Math.atan2(b.y-g.y,b.x-g.x));
    const keep=new Set();for(let i=0;i<room;i++)keep.add(direct[Math.floor(i*direct.length/room)]);
    const hosts=[...keep],kids=new Map(hosts.map(h=>[h,0]));
    for(const t of state.tasks)if(t.gid===g.id&&t.parent!==g.id&&kids.has(find(t.parent)))kids.set(find(t.parent),kids.get(find(t.parent))+1);
    for(const t of direct){
      if(keep.has(t))continue;
      let best=null,bd=1e9;
      for(const h of hosts){if((kids.get(h)||0)>=2)continue;const d=Math.hypot(h.x-t.x,h.y-t.y);if(d<bd){bd=d;best=h}}
      if(!best)break;
      t.parent=best.id;kids.set(best,(kids.get(best)||0)+1);hosts.push(t);kids.set(t,0);
      // start it just outside its new host so it slides into place
      const ol=Math.hypot(best.x-g.x,best.y-g.y)||1;t.x=best.x+(best.x-g.x)/ol*best.rr*.6;t.y=best.y+(best.y-g.y)/ol*best.rr*.6;t.vx=t.vy=0;
    }
  }
}
function toGhost(n){
  state.tasks.filter(t=>t.gid===n.id).forEach(toGhost);
  if(n.kind==='task')adopt(n);
  state.groups=state.groups.filter(g=>g!==n);state.tasks=state.tasks.filter(t=>t!==n);
  n.dying=true;ghosts.push(n);dropLabel(n.id);
}

/* =================== interaction =================== */
function toWorld(e){const r=stage.getBoundingClientRect();return [(e.clientX-r.left-view.cx)/view.s,(e.clientY-r.top-view.cy)/view.s]}
const hit=e=>{const [x,y]=toWorld(e);const n=owner(x,y,geo);return n&&!n.dying?n:null};
let press=null,suppress=false;
const ptrs=new Map();let gest=null,lastTap=0;
const zoomHint=$('#zoomHint');
function paintZoom(){zoomHint.classList.toggle('on',uz!==1||ux!==0||uy!==0);wake(3)}
function resetZoom(){uz=1;ux=0;uy=0;paintZoom()}
zoomHint.addEventListener('click',resetZoom);
function startGesture(){
  const r=stage.getBoundingClientRect(),P=[...ptrs.values()];
  const mx=P.reduce((a,p)=>a+p.x,0)/P.length,my=P.reduce((a,p)=>a+p.y,0)/P.length;
  gest={n:P.length,mx,my,d:P.length>1?Math.hypot(P[0].x-P[1].x,P[0].y-P[1].y):0,uz,ux,uy,
    wx:(mx-r.left-view.cx)/view.s,wy:(my-r.top-view.cy)/view.s,moved:false};
}
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('.lab.editing'))return;

  if(!n||tool!=='cursor'||n===center||editing||ptrs.size>1)return;

});

  ptrs.delete(e.pointerId);

    if(!gest.moved&&gest.n===1&&!ptrs.size&&e.type==='pointerup'){       // double-tap empty paper resets the zoom
      const now=performance.now();if(now-lastTap<320){resetZoom();lastTap=0}else lastTap=now;

};

  e.preventDefault();const r=stage.getBoundingClientRect();
  if(e.ctrlKey){const k=Math.exp(-e.deltaY*.01),nz=Math.max(1,Math.min(4,uz*k)),wx=(e.clientX-r.left-view.cx)/view.s,wy=(e.clientY-r.top-view.cy)/view.s;
    uz=nz;const s2=view.base*uz;ux=e.clientX-r.left-stage.clientWidth/2-cam.x+(view.mx-wx)*s2;uy=e.clientY-r.top-stage.clientHeight/2-cam.y+(view.my-wy)*s2}
  else{ux-=e.deltaX;uy-=e.deltaY}

    toast('Deleted “'+n.text+'”',()=>{const o=JSON.parse(snap);state.groups=o.groups;state.tasks=o.tasks;normalise();
      [...state.groups,...state.tasks].forEach(x=>{prep(x,true)});ghosts=[];[...els.keys()].forEach(dropLabel);paintCenter();save()});
  }

/* =================== popping =================== */
function pop(n,hx,hy){
  const g=n.kind==='task'?groupOf(n):null,h=hueOf(n);
  state.done.push({id:uid(),text:n.text,group:g?g.text:'',gid:g?g.id:null,hue:h,kind:n.kind,created:n.created,completed:Date.now()});
  if(n.kind==='task')adopt(n);
  state.groups=state.groups.filter(x=>x!==n);state.tasks=state.tasks.filter(x=>x!==n);
  dropLabel(n.id);popFx(n,h,hx??n.x,hy??n.y-n.rr*.5);popSound();
  // the neighbours lose a wall: give them a little kick, like real foam relaxing
  for(const q of live())if(!q.fixed){const dx=q.x-n.x,dy=q.y-n.y,d=Math.hypot(dx,dy)||1;if(d<n.rr+q.rr){q.vx-=dx/d*1.5;q.vy-=dy/d*1.5}}
  paintCenter();save();
}
function popFx(n,h,hx,hy){
  const r=n.rr,pad=r*.9,size=2*(r+pad),q=Math.min(2,(devicePixelRatio||1)*view.s*1.2);
  const c=document.createElement('canvas');c.className='popc';c.width=Math.ceil(size*q);c.height=Math.ceil(size*q);
  c.style.width=size+'px';c.style.height=size+'px';c.style.transform=`translate(${n.x-r-pad}px,${n.y-r-pad}px)`;
  world.appendChild(c);
  const g=c.getContext('2d');g.scale(q,q);
  const film=filmSprite(Math.round(h),Math.floor(seedOf(n)*4),false);
  // where the pin went in, relative to the bubble
  let ax=hx-n.x,ay=hy-n.y;const al=Math.hypot(ax,ay);if(al>r*.95){ax*=r*.95/al;ay*=r*.95/al}
  const ang0=Math.atan2(ay,ax),drops=[];
  for(let i=0;i<70;i++){const a=Math.random()*TAU;let da=Math.abs(((a-ang0+Math.PI)%TAU+TAU)%TAU-Math.PI);
    drops.push({a,t0:da/Math.PI*60+Math.random()*12,sp:.25+Math.random()*.55,sz:.5+Math.random()*1.8})}
  const t0=performance.now();
  (function frame(){
    const t=performance.now()-t0;g.clearRect(0,0,size,size);
    // 1. the film: still whole, with a hole that races out from the puncture (~90 ms, as in real life)
    const hole=Math.pow(Math.min(1,t/90),1.6)*(2.2*r);
    if(hole<2.1*r){
      g.save();g.beginPath();g.arc(pad+r,pad+r,r,0,TAU);g.arc(pad+r+ax,pad+r+ay,hole,0,TAU,true);g.clip('evenodd');
      g.drawImage(film,pad,pad,2*r,2*r);g.drawImage(specSprite,pad,pad,2*r,2*r);
      // the retreating edge thickens into a bright rim
      g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=2;g.beginPath();g.arc(pad+r+ax,pad+r+ay,hole,0,TAU);g.stroke();g.restore();
    }
    // 2. droplets thrown off as the edge sweeps past, falling under gravity
    for(const d of drops){const tt=t-d.t0;if(tt<0)continue;const life=Math.min(1,tt/520);if(life>=1)continue;
      const dist=r+tt*d.sp*.55,x=pad+r+Math.cos(d.a)*dist,y=pad+r+Math.sin(d.a)*dist+.00018*tt*tt*r*.6;
      g.globalAlpha=(1-life)*.95;g.fillStyle='#fff';g.beginPath();g.arc(x,y,d.sz*(1-life*.5),0,TAU);g.fill()}
    g.globalAlpha=1;
    // 3. a faint shimmer ring
    if(t<260){g.strokeStyle=`rgba(255,255,255,${.35*(1-t/260)})`;g.lineWidth=1.5;g.beginPath();g.arc(pad+r,pad+r,r*(1+t/900),0,TAU);g.stroke()}
    if(t<720)requestAnimationFrame(frame);else c.remove();
  })();
}
let actx=null;
function popSound(){
  if(!state.sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const t=actx.currentTime+.005,sr=actx.sampleRate,out=actx.createGain();out.gain.value=.9;out.connect(actx.destination);
    // 1. the snap: a very short, bright click
    const n=Math.floor(sr*.018),buf=actx.createBuffer(1,n,sr),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,5);
    const src=actx.createBufferSource();src.buffer=buf;
    const hp=actx.createBiquadFilter();hp.type='highpass';hp.frequency.value=1600;
    const cg=actx.createGain();cg.gain.value=.8;src.connect(hp);hp.connect(cg);cg.connect(out);src.start(t);
    // 2. the "pop": a fast downward pitch drop, like a cork
    const o=actx.createOscillator(),og=actx.createGain();o.type='sine';
    o.frequency.setValueAtTime(1150+Math.random()*250,t);o.frequency.exponentialRampToValueAtTime(130,t+.05);
    og.gain.setValueAtTime(.0001,t);og.gain.linearRampToValueAtTime(.85,t+.003);og.gain.exponentialRampToValueAtTime(.001,t+.1);
    o.connect(og);og.connect(out);o.start(t);o.stop(t+.12);
    // 3. a tiny watery "plip" after it
    const p=actx.createOscillator(),pg=actx.createGain();p.type='triangle';
    p.frequency.setValueAtTime(1700,t+.03);p.frequency.exponentialRampToValueAtTime(2900,t+.07);
    pg.gain.setValueAtTime(.0001,t+.03);pg.gain.linearRampToValueAtTime(.12,t+.035);pg.gain.exponentialRampToValueAtTime(.001,t+.09);
    p.connect(pg);pg.connect(out);p.start(t+.03);p.stop(t+.1);
  }catch(e){}
}

/* =================== tools / tabs / toast =================== */
const HELP={
  cursor:'Tap the date to add a group · tap a group to add tasks · tap a task or hold a group to rename',
  pin:'Tap a task bubble to pop it — it moves to Completed',
  erase:'Tap any bubble to delete it (groups take their tasks with them)'
};
const HELP_M={cursor:'tap the date → group · tap a group → task · hold to rename',pin:'tap a task to pop it',erase:'tap a bubble to delete it'};
const phone=()=>innerWidth<640;
function paintHelp(){
  helpEl.textContent=(phone()?HELP_M:HELP)[tool];
  helpEl.style.visibility=(editing&&editing.bar)||(!state.groups.length&&tool==='cursor')?'hidden':'';
}
function setTool(t){
  wake();
  if(editing)commitEdit();
  tool=t;document.body.classList.remove('pin','erase');if(t!=='cursor')document.body.classList.add(t);
  document.querySelectorAll('[data-tool]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tool===t));
  paintHelp();stage.style.cursor=t==='pin'?'none':t==='erase'?'crosshair':'default';
}
$('#tools').addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(b)setTool(b.dataset.tool)});
function paintSound(){$('#soundBtn').setAttribute('aria-pressed',state.sound);$('#wave').style.display=state.sound?'':'none'}
$('#soundBtn').addEventListener('click',()=>{state.sound=!state.sound;paintSound();save();if(state.sound)popSound()});
addEventListener('keydown',e=>{
  if(editing||e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==='v')setTool('cursor');if(k==='p')setTool('pin');if(k==='x')setTool('erase');if(k==='escape')setTool('cursor');
});
let onDone=false;
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{
  if(editing)commitEdit();
  document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));
  onDone=b.dataset.tab==='done';
  stage.style.visibility=onDone?'hidden':'';$('#doneView').hidden=!onDone;$('#tools').style.display=onDone?'none':'';
  helpEl.style.display=onDone?'none':'';
  if(onDone)renderDone();else wake(4);
}));
let toastT;
function toast(msg,undo){
  toastEl.textContent=msg;
  if(undo){const b=document.createElement('button');b.textContent='Undo';b.onclick=()=>{undo();toastEl.classList.remove('show')};toastEl.appendChild(b)}
  toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),undo?6000:3500);
}

/* =================== completed tab =================== */
function renderDone(){
  const root=$('#doneInner');root.innerHTML='';
  const days={};state.done.slice().sort((a,b)=>b.completed-a.completed).forEach(d=>{(days[ymd(new Date(d.completed))]??=[]).push(d)});
  const keys=Object.keys(days).sort().reverse(),t=today();
  let streak=0,cur=new Date();if(!days[t])cur.setDate(cur.getDate()-1);
  while(days[ymd(cur)]){streak++;cur.setDate(cur.getDate()-1)}
  const el=(tag,cls,txt)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(txt!=null)x.textContent=txt;return x};
  const stats=el('div','stats');
  [[(days[t]||[]).length,'popped today'],[state.done.length,'all time'],[streak,'day streak 🔥']].forEach(([n,l])=>{const s=el('div','stat');s.append(el('b',null,n),el('span',null,l));stats.append(s)});
  root.append(stats);
  const wk=el('div','week'),counts=[];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);counts.push([d,(days[ymd(d)]||[]).length])}
  const max=Math.max(1,...counts.map(c=>c[1]));
  counts.forEach(([d,c],i)=>{const col=el('div',i===6?'t':'');const bar=el('i');bar.style.height=(c?8+c/max*46:4)+'px';bar.style.opacity=c?1:.25;
    col.append(el('span',null,c||''),bar,el('span',null,d.toLocaleDateString(undefined,{weekday:'narrow'})));wk.append(col)});
  root.append(wk);
  if(!keys.length){root.append(el('div','empty','Nothing popped yet.\nPick the pin and pop a task bubble — it will land here as your daily log.'));return}
  keys.forEach(k=>{
    const sec=el('div','day'),h=el('h3'),diff=dayDiff(k,t);
    const label=diff===0?'Today':diff===1?'Yesterday':new Date(k+'T12:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
    h.append(el('div',null,label),el('span',null,days[k].length+' done'));sec.append(h);
    days[k].forEach((d,i)=>{
      const it=el('div','item');it.style.setProperty('--h',d.hue);it.style.animationDelay=Math.min(i*30,300)+'ms';
      const body=el('div','tx',d.text);
      body.append(document.createElement('br'),el('span','chip',d.group||(d.kind==='group'?'Group':'Task')));
      const u=el('button','undo','↩');u.title='Put this bubble back';u.onclick=()=>restore(d.id);
      it.append(el('div','tick','✓'),body,el('div','when',new Date(d.completed).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})),u);sec.append(it);
    });
    root.append(sec);
  });
}
function restore(id){
  const d=state.done.find(x=>x.id===id);if(!d)return;
  if(d.kind==='group')newGroup(d.text,d.hue,d.created);
  else{let g=state.groups.find(x=>x.id===d.gid);if(!g)g=newGroup(d.group||'Restored',d.hue,d.created);newTask(g,d.text,d.created)}
  state.done=state.done.filter(x=>x!==d);
  paintCenter();save();renderDone();toast('Bubble put back on the board');
}

/* =================== pin cursor =================== */
const pinEl=$('#pin');
let px=0,py=0;
addEventListener('pointermove',e=>{
  px=e.clientX;py=e.clientY;
  if(e.pointerType==='mouse'){document.body.classList.add('hasmouse');
    pinEl.style.visibility=e.target.closest&&e.target.closest('.tools,.top')?'hidden':'visible';
    pinEl.style.transform=`translate(${px-24}px,${py-46}px)`}
});
addEventListener('pointerdown',e=>{if(tool==='pin'){pinEl.classList.add('stab');setTimeout(()=>pinEl.classList.remove('stab'),130)}
  if(e.pointerType!=='mouse')document.body.classList.remove('hasmouse')});
document.documentElement.addEventListener('pointerleave',()=>{pinEl.style.visibility='hidden'});

/* =================== day roll-over =================== */
let shownDay=today();
function checkDay(){
  const t=today();
  if(t!==shownDay){shownDay=t;paintCenter();if(state.tasks.length||state.groups.length)toast('☀️ New day! Your unpopped bubbles rolled over.')}
}
setInterval(checkDay,20000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else checkDay()});
addEventListener('pagehide',save);
setInterval(save,15000);

/* =================== main loop =================== */
let last=performance.now(),acc=0;
function frame(t){
  acc+=Math.min(80,t-last);last=t;
  motion=0;while(acc>=16.67){step(t);acc-=16.67}
  if(!onDone){
    fitView();
    if(motion>.015||wakeN>0||!state.groups.length){
      const q=performance.now();draw(t);frameNo++;syncLabels();if(wakeN>0)wakeN--;
      // on a slow device, drop canvas resolution rather than stutter
      if(performance.now()-q>22){if(++slowFrames>20&&maxDpr>1){maxDpr=Math.max(1,maxDpr-.5);slowFrames=0}}else slowFrames=Math.max(0,slowFrames-1);
    }
  }
  requestAnimationFrame(frame);
}
paintSound();setTool('cursor');paintCenter();fitView();
for(let i=0;i<200;i++)step(0);                 // settle a saved board before first paint
requestAnimationFrame(frame);
if(state.lastOpen&&state.lastOpen!==today()&&(state.tasks.length||state.groups.length)){
  const days=dayDiff(state.lastOpen,today()),n=state.tasks.length+state.groups.length;
  setTimeout(()=>toast(`☀️ New day — ${n} bubble${n>1?'s':''} rolled over from ${days===1?'yesterday':days+' days ago'}`),600);
}
save();

addEventListener('resize',()=>{wake(4);paintHelp()});

/* =================== backup & restore =================== */
const bk=$('#backup'),bkMsg=$('#bkMsg');
const backupText=()=>JSON.stringify({app:'bubble-day',v:1,saved:new Date().toISOString(),data:JSON.parse(JSON.stringify(state,(k,v)=>TRANSIENT.has(k)?undefined:v))});
function openBackup(){if(editing)commitEdit();bkMsg.textContent='';$('#bkText').value='';bk.hidden=false}
if(window.top!==window)$('#bkDownload').hidden=true;   // embedded pages can't download files: offer copy instead
$('#backupBtn').addEventListener('click',openBackup);
$('#bkClose').addEventListener('click',()=>bk.hidden=true);
bk.addEventListener('click',e=>{if(e.target===bk)bk.hidden=true});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!bk.hidden)bk.hidden=true});
$('#bkDownload').addEventListener('click',()=>{
  try{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([backupText()],{type:'application/json'}));
    a.download=`bubble-day-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    bkMsg.textContent='Backup file saved ✓  (if nothing downloaded, use “Copy as text”)';
  }catch(e){bkMsg.textContent='Downloads are blocked here: use “Copy as text” instead.'}
});
$('#bkCopy').addEventListener('click',async()=>{
  const txt=backupText();
  try{await navigator.clipboard.writeText(txt);bkMsg.textContent='Copied ✓  Paste it into Bubble Day on your other device.'}
  catch(e){const ta=$('#bkText');ta.value=txt;ta.select();bkMsg.textContent='Couldn’t copy automatically: the backup is in the box below, copy it from there.'}
});
$('#bkPick').addEventListener('click',()=>$('#bkFile').click());
$('#bkFile').addEventListener('change',async e=>{const f=e.target.files[0];if(f)restoreFrom(await f.text());e.target.value=''});
$('#bkRestore').addEventListener('click',()=>restoreFrom($('#bkText').value));
function restoreFrom(txt){
  let o;try{o=JSON.parse(txt.trim())}catch(e){bkMsg.textContent='That doesn’t look like a Bubble Day backup.';return}
  const d=o&&o.data?o.data:o;
  if(!d||!Array.isArray(d.groups)||!Array.isArray(d.tasks)||!Array.isArray(d.done)){bkMsg.textContent='That doesn’t look like a Bubble Day backup.';return}
  const n=d.groups.length+d.tasks.length;
  if((state.groups.length||state.tasks.length||state.done.length)&&!bkMsg.dataset.confirm){
    bkMsg.dataset.confirm='1';bkMsg.textContent=`This replaces the bubbles on this device with the backup (${n} bubbles, ${d.done.length} completed). Tap restore again to confirm.`;
    setTimeout(()=>delete bkMsg.dataset.confirm,8000);return;
  }
  saveBlocked=true;   // stop the page saving its old board over the backup while it reloads
  try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){saveBlocked=false;bkMsg.textContent='Couldn’t save on this device.';return}
  bkMsg.textContent='Restored ✓';setTimeout(()=>location.reload(),400);
}

/* =================== installable app: work offline =================== */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&window.top===window){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
window.__bd={filmSprite,specSprite,skyC,get motion(){return motion},get frames(){return frameNo},state,newGroup,newTask,setTool,pop,find,get geo(){return geo},center};
})();
